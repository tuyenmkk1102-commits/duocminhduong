<style>
/* Layout: cột điều hướng trái + vùng làm việc; điện thoại chuyển thành thanh tab cuộn ngang */
:root{
  --bg:#F4F4EE; --surface:#FFFFFF; --sunk:#ECEDE3; --ink:#1E2114; --muted:#646856; --line:#E0E2D4;
  --accent:#5C6A10; --accent-ink:#FFFFFF; --accent-soft:#EBEED8;
  --views:#1E6A73; --views-soft:#DFEFF0;
  --good:#2B7A3E; --good-soft:#E2F1E5; --warn:#A06A10; --warn-soft:#F8EED7; --bad:#B3372B; --bad-soft:#F8E2DF;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Saira Condensed","Be Vietnam Pro",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121409; --surface:#1B1E12; --sunk:#16180E; --ink:#ECEEDF; --muted:#A3A78F; --line:#2D311F;
  --accent:#B6C75A; --accent-ink:#151807; --accent-soft:#2A3015;
  --views:#6FC2CB; --views-soft:#16302F;
  --good:#5CC47A; --good-soft:#16301C; --warn:#E3AE4D; --warn-soft:#33270F; --bad:#F07264; --bad-soft:#3A1C18;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121409; --surface:#1B1E12; --sunk:#16180E; --ink:#ECEEDF; --muted:#A3A78F; --line:#2D311F;
  --accent:#B6C75A; --accent-ink:#151807; --accent-soft:#2A3015;
  --views:#6FC2CB; --views-soft:#16302F;
  --good:#5CC47A; --good-soft:#16301C; --warn:#E3AE4D; --warn-soft:#33270F; --bad:#F07264; --bad-soft:#3A1C18;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px 18px;margin-bottom:8px;border-bottom:1px solid var(--line);font-family:var(--display);font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1;color:var(--accent)}
.brand img{width:56px;height:auto;background:#FFFFFF;border-radius:10px;padding:4px;flex:none}
.brand small{display:block;font-family:var(--font);font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:0;text-transform:none;margin-top:3px}
nav.side button{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
nav.side button:hover{background:var(--sunk);color:var(--ink)}
nav.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.badge{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--bad);color:var(--surface)}
.conn{margin-top:auto;font-size:12px;color:var(--muted);padding:10px}
.conn i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.conn.live i{background:var(--good)} .conn.local i{background:var(--warn)}
main{padding-block:22px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0;max-width:1240px;width:100%}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-family:var(--display);font-size:30px;font-weight:800;text-transform:uppercase;letter-spacing:.01em;margin:0;line-height:1.1;text-wrap:balance;color:var(--accent)}
h2{font-size:15px;font-weight:700;margin:0 0 12px}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:3px}
.month input{border:0;background:none;padding:5px 6px;font-weight:600}
.iconbtn{border:0;background:none;width:32px;height:32px;border-radius:7px;cursor:pointer;font-size:16px;color:var(--muted)}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-weight:500}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.tile .lab{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.tile .val{font-family:var(--display);font-size:32px;font-weight:700;letter-spacing:.01em;margin-top:2px;line-height:1.1}
.tile .sub{font-size:12px;color:var(--muted);margin-top:4px}
.tile.money .val{color:var(--accent)} .tile.views .val{color:var(--views)}
.neg{color:var(--bad)!important}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.toolbar input[type=search]{flex:1 1 200px;min-width:0}
.toolbar .spacer{flex:1}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer} tbody tr.row:hover td{background:var(--sunk)}
td.num,th.num{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;background:var(--sunk)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.v{background:var(--views-soft);color:var(--views)}
button.pill{border:0;cursor:pointer}
.muted{color:var(--muted)} .small{font-size:12px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;min-width:0}
.col h3{font-size:13px;margin:2px 4px 10px;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--muted)}
.card .t{font-weight:600;overflow-wrap:anywhere}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted)}
.card.overdue{border-left:3px solid var(--bad)}
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.report:hover{border-color:var(--muted)}
.report .head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.report dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;margin:0}
.report dt{color:var(--muted);font-size:12px;font-weight:600;padding-top:1px}
.report dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:5px}
.bar span{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.v span{background:var(--views)} .bar.done span{background:var(--good)}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi .k{font-size:12px;color:var(--muted)} .kpi .n{font-weight:600}
.kpicard{display:grid;gap:12px}
.kpicard .who{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.who .nm{font-weight:700;font-size:15px}
.big{font-family:var(--display);font-size:26px;font-weight:700}
.list{display:grid;gap:8px}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{min-width:0;overflow-wrap:anywhere}
svg text{fill:var(--muted);font-family:var(--font);font-size:11px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,8,14,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:20}
.sheet{background:var(--surface);border-radius:14px;width:100%;max-width:560px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet h2{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.02em;color:var(--accent);margin-bottom:14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:grid;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.fld textarea{min-height:72px;resize:vertical}
.actions{display:flex;gap:8px;margin-top:18px;align-items:center}
.actions .spacer{flex:1}
.err{color:var(--bad);font-size:13px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:900px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:minmax(0,1fr)}
  .kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));z-index:10;gap:4px}
  nav.side .brand,nav.side .conn{display:none}
  nav.side button{white-space:nowrap;flex:0 0 auto}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 60px}
  .board{grid-template-columns:minmax(0,1fr)}
  .fields{grid-template-columns:minmax(0,1fr)}
  .report dl{grid-template-columns:minmax(0,1fr)}
  .tile .val{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

body{margin:0}
[hidden]{display:none!important}
.side .me{padding:10px;border-top:1px solid var(--line);margin-top:auto;display:grid;gap:6px;font-size:12.5px}
.side .me b{font-size:13px}
.side .me .row2{display:flex;gap:6px}
.side .me button{flex:1;justify-content:center;font-size:12px;padding:6px 8px;color:var(--ink)}
.mobile-me{display:none}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:var(--bg)}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;width:100%;max-width:380px;display:grid;gap:14px;text-align:center}
.login img{width:110px;height:auto;margin:0 auto;background:#FFFFFF;border-radius:14px;padding:6px}
.login h1{font-size:26px}
.login p{margin:0;color:var(--muted)}
.login input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;text-align:center;width:100%}
.login input#pin{font-size:24px;letter-spacing:.4em;font-weight:700}
.login .btn{justify-content:center;padding:12px;font-size:15px}
.login .err{margin:0}
.boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted);font-weight:600;z-index:40}
@media (max-width:760px){
  .side .me{display:none}
  .mobile-me{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);width:100%;justify-content:space-between;margin-top:-8px;margin-bottom:12px}
  .mobile-me button{font-size:12px;padding:5px 10px}
}

.chans{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.chan{display:grid;gap:3px}
.chan-h{display:flex;gap:6px}
.chan-n{font-weight:700;overflow-wrap:anywhere}
.chan-f{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1}
.chan-f small{font-family:var(--font);font-size:12px;font-weight:500;color:var(--muted)}
.up{color:var(--good)}
.pill.tt{background:var(--ink);color:var(--surface)} .pill.fb{background:var(--views-soft);color:var(--views)}
.copyrow{display:flex;gap:8px;align-items:center}
.copyrow code{flex:1;min-width:0;overflow-wrap:anywhere;background:var(--sunk);padding:8px 10px;border-radius:8px;font-size:12px}
td select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;max-width:180px}
.btn:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>

<script>
const COLS=['staff','tasks','reports','orders','expenses','views','channels','posts','follows'];
let SETTINGS=null, TTLINK='';
const D={}; COLS.forEach(c=>D[c]=[]);
let ME=null, PIN='';
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const S={view:'overview',month:todayStr().slice(0,7),f:{}};
try{const v=localStorage.getItem('md-view'); if(v) S.view=v;}catch(e){}

const ORDER_STATUS=['Mới','Đang giao','Thành công','Hoàn/Hủy'];
const TASK_STATUS=['Cần làm','Đang làm','Xong'];
const PRIORITY=['Cao','Trung bình','Thấp'];
const CHANNELS=['TikTok Shop','Facebook','Zalo','Shopee','Website','Tại cửa hàng','Khác'];
const EXP_CAT=['Quảng cáo','Nhập hàng','Vận chuyển','Mặt bằng / điện nước','Công cụ / phần mềm','Khác'];
const PLATFORMS=['TikTok','Reels','Facebook','YouTube Shorts','Fanpage / bài viết','Website'];
const ROLES=['Nhân viên','Quản lý'];

const FIELDS={
  staff:[{k:'name',l:'Họ tên',t:'text',req:1},{k:'role',l:'Quyền',t:'sel',o:ROLES},
    {k:'pin',l:'Mã PIN đăng nhập (4–8 số)',t:'text',req:1,ph:'VD: 482915'},{k:'baseSalary',l:'Lương cứng / tháng (₫)',t:'num'},
    {k:'commission',l:'Hoa hồng (% doanh thu)',t:'num',step:'0.1'},{k:'kpiOrders',l:'KPI số đơn / tháng',t:'num'},
    {k:'kpiRevenue',l:'KPI doanh thu / tháng (₫)',t:'num'},{k:'kpiVideos',l:'KPI số video / bài / tháng',t:'num'},{k:'kpiViews',l:'KPI lượt view / tháng',t:'num'}],
  tasks:[{k:'title',l:'Việc cần làm',t:'text',req:1,wide:1},{k:'staffId',l:'Người phụ trách',t:'staff'},{k:'due',l:'Hạn',t:'date'},
    {k:'priority',l:'Ưu tiên',t:'sel',o:PRIORITY,d:'Trung bình'},{k:'status',l:'Trạng thái',t:'sel',o:TASK_STATUS},{k:'note',l:'Ghi chú',t:'area',wide:1}],
  reports:[{k:'date',l:'Ngày',t:'date',req:1},{k:'staffId',l:'Người báo cáo',t:'staff',req:1},
    {k:'done',l:'Hôm nay đã làm',t:'area',req:1,wide:1},{k:'plan',l:'Ngày mai sẽ làm',t:'area',wide:1},{k:'issue',l:'Vướng mắc / cần hỗ trợ',t:'area',wide:1}],
  orders:[{k:'date',l:'Ngày',t:'date',req:1},{k:'code',l:'Mã đơn',t:'text'},{k:'customer',l:'Khách hàng',t:'text'},{k:'phone',l:'Số điện thoại',t:'text'},
    {k:'product',l:'Sản phẩm',t:'text'},{k:'qty',l:'Số lượng',t:'num',d:1},{k:'amount',l:'Thành tiền (₫)',t:'num',req:1},
    {k:'channel',l:'Kênh bán',t:'sel',o:CHANNELS},{k:'status',l:'Trạng thái',t:'sel',o:ORDER_STATUS},{k:'staffId',l:'Nhân viên chốt',t:'staff'},{k:'note',l:'Ghi chú',t:'area',wide:1}],
  expenses:[{k:'date',l:'Ngày',t:'date',req:1},{k:'category',l:'Khoản chi',t:'sel',o:EXP_CAT},{k:'amount',l:'Số tiền (₫)',t:'num',req:1},
    {k:'staffId',l:'Người chi',t:'staff'},{k:'note',l:'Nội dung',t:'area',wide:1}],
  views:[{k:'date',l:'Ngày đăng',t:'date',req:1},{k:'platform',l:'Nền tảng',t:'sel',o:PLATFORMS},{k:'title',l:'Tên video / bài',t:'text',req:1,wide:1},
    {k:'link',l:'Link',t:'text',wide:1},{k:'views',l:'Lượt view',t:'num',req:1},{k:'staffId',l:'Người làm',t:'staff'}]
};
const NAMES={staff:'nhân viên',tasks:'công việc',reports:'báo cáo',orders:'đơn hàng',expenses:'khoản chi',views:'video / bài'};
const TITLES={overview:'Tổng quan',tasks:'Công việc',reports:'Báo cáo ngày',orders:'Đơn hàng',money:'Tiền',views:'View',kpi:'KPI nhân viên',staff:'Nhân viên',channels:'Kết nối MXH'};
const ADMIN_VIEWS=['money','staff','channels'];

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=n=>new Intl.NumberFormat('vi-VN').format(Math.round(+n||0));
const vnd=n=>nf(n)+' ₫';
function short(n){n=+n||0;const a=Math.abs(n),f=(x,u)=>(Math.round(x*10)/10).toString().replace('.',',')+u;
  if(a>=1e9)return f(n/1e9,' tỷ'); if(a>=1e6)return f(n/1e6,' tr'); if(a>=1e4)return f(n/1e3,'k'); return nf(n);}
const dmy=s=>s?String(s).slice(8,10)+'/'+String(s).slice(5,7):'';
const sum=(a,k)=>a.reduce((t,x)=>t+(+x[k]||0),0);
const inMonth=r=>String(r.date||'').startsWith(S.month);
const chanName=id=>{const c=D.channels.find(x=>x.id===id);return c?c.name:'';};
const staffName=id=>{const s=D.staff.find(x=>x.id===id);return s?s.name:'—';};
const pct=(v,t)=>t>0?Math.round(v/t*100):null;
const isAdmin=()=>!!(ME&&ME.admin);
const mine=r=>r&&(r.createdBy===ME.id||r.staffId===ME.id);
const canEdit=(col,r)=>isAdmin()||(!ADMIN_VIEWS.includes(col)&&col!=='expenses'&&(!r||mine(r)));

function calc(){
  const orders=D.orders.filter(inMonth), valid=orders.filter(o=>o.status!=='Hoàn/Hủy');
  const revenue=sum(valid,'amount'), done=sum(valid.filter(o=>o.status==='Thành công'),'amount');
  const exps=D.expenses.filter(inMonth), expTotal=sum(exps,'amount');
  const byCat={}; exps.forEach(e=>{const c=e.category||'Khác';byCat[c]=(byCat[c]||0)+(+e.amount||0)});
  const views=D.views.filter(inMonth).concat(D.posts.filter(inMonth).map(p=>({...p,auto:true}))), viewTotal=sum(views,'views');
  const people=D.staff.map(s=>{const my=valid.filter(o=>o.staffId===s.id), rev=sum(my,'amount');
    const base=+s.baseSalary||0, com=rev*(+s.commission||0)/100, vids=views.filter(v=>v.staffId===s.id);
    return {s,orders:my.length,rev,base,com,pay:base+com,videos:vids.length,views:sum(vids,'views')}});
  const payroll=people.reduce((t,p)=>t+p.pay,0);
  return {orders,valid,revenue,done,exps,expTotal,byCat,views,viewTotal,people,payroll,profit:revenue-expTotal-payroll,cancelled:orders.length-valid.length};
}

/* ---------- charts ---------- */
function niceMax(m){if(m<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(m)));for(const s of [1,2,2.5,5,10])if(s*p>=m)return s*p;return 10*p;}
function barChart(vals,color,fmt){
  const W=640,H=190,L=46,B=22,T=8,n=vals.length,max=niceMax(Math.max(...vals,0)),cw=(W-L-6)/n;
  let g='';
  [0,.5,1].forEach(f=>{const y=T+(H-T-B)*(1-f);g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${short(max*f)}</text>`});
  vals.forEach((v,i)=>{const h=(H-T-B)*(v/max),x=L+i*cw+cw*.18;
    if(v>0)g+=`<rect x="${x.toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${(cw*.64).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${color}"><title>Ngày ${i+1}: ${fmt(v)}</title></rect>`;
    if(i===0||(i+1)%5===0)g+=`<text x="${(L+i*cw+cw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${i+1}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biểu đồ theo ngày">${g}</svg>`;
}
function daily(rows,key){const [y,m]=S.month.split('-').map(Number),n=new Date(y,m,0).getDate(),a=Array(n).fill(0);
  rows.forEach(r=>{const d=+String(r.date||'').slice(8,10);if(d>=1&&d<=n)a[d-1]+=(+r[key]||0)});return a;}

/* ---------- views ---------- */
const emptyBox=(t,s,btn)=>`<div class="panel empty"><b>${t}</b>${s}${btn?`<div style="margin-top:14px">${btn}</div>`:''}</div>`;
const addBtn=(col,label)=>canEdit(col)?`<button class="btn primary" data-act="add" data-col="${col}">+ ${label||'Thêm '+NAMES[col]}</button>`:'';
const statusPill=s=>`<span class="pill ${{'Thành công':'good','Đang giao':'warn','Hoàn/Hủy':'bad','Mới':'acc'}[s]||''}">${esc(s||'Mới')}</span>`;
function needStaff(){return D.staff.length>1||!isAdmin()?'':`<div class="notice">Vào mục <b>Nhân viên</b> thêm từng người kèm mã PIN, rồi gửi link trang cùng mã PIN cho họ để đăng nhập.</div>`;}

function vOverview(){
  const c=calc(), t=todayStr();
  const open=D.tasks.filter(x=>x.status!=='Xong').sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1);
  const myOpen=isAdmin()?open:open.filter(x=>x.staffId===ME.id);
  const reported=new Set(D.reports.filter(r=>r.date===t).map(r=>r.staffId));
  const missing=D.staff.filter(s=>!reported.has(s.id));
  const tile=(cls,lab,val,sub)=>`<div class="panel tile ${cls}"><div class="lab">${lab}</div><div class="val">${val}</div><div class="sub">${sub}</div></div>`;
  const od=myOpen.filter(x=>x.due&&x.due<t).length;
  return needStaff()+`<div class="grid tiles">
    ${tile('money','Doanh thu',short(c.revenue),`${c.valid.length} đơn · đã giao xong ${short(c.done)}`)}
    ${isAdmin()?tile('','Lợi nhuận',`<span class="${c.profit<0?'neg':''}">${short(c.profit)}</span>`,`Chi ${short(c.expTotal)} · lương ${short(c.payroll)}`)
      :tile('','Việc của tôi',nf(myOpen.length),od?`<span class="neg">${od} việc quá hạn</span>`:'Không có việc quá hạn')}
    ${tile('','Đơn hàng',nf(c.orders.length),`${c.cancelled} đơn hoàn/hủy`)}
    ${tile('views','Lượt view',short(c.viewTotal),`${c.views.length} video / bài${D.channels.length?' · '+short(sum(D.channels,'followers'))+' follower':''}`)}
  </div>
  <div class="grid two" style="margin-top:14px">
    <div class="panel"><h2>Doanh thu theo ngày</h2>${barChart(daily(c.valid,'amount'),'var(--accent)',vnd)}
      <h2 style="margin-top:14px">Lượt view theo ngày đăng</h2>${barChart(daily(c.views,'views'),'var(--views)',nf)}</div>
    <div class="grid" style="align-content:start">
      <div class="panel"><h2>${isAdmin()?'Việc đang mở':'Việc của tôi'} (${myOpen.length})</h2>${myOpen.length?`<div class="list">${myOpen.slice(0,7).map(x=>{const o=x.due&&x.due<t;
        return `<div class="li"><div class="t">${esc(x.title)}<div class="small muted">${esc(staffName(x.staffId))}${x.due?' · hạn '+dmy(x.due):''}</div></div>${o?'<span class="pill bad">Quá hạn</span>':`<span class="pill">${esc(x.status)}</span>`}</div>`}).join('')}</div>`:'<div class="muted">Không còn việc nào đang mở.</div>'}</div>
      <div class="panel"><h2>Báo cáo hôm nay</h2>${missing.length?`<div class="small muted" style="margin-bottom:8px">${D.staff.length-missing.length}/${D.staff.length} người đã nộp. Chưa nộp:</div><div style="display:flex;flex-wrap:wrap;gap:6px">${missing.map(s=>`<span class="pill warn">${esc(s.name)}</span>`).join('')}</div>`:'<span class="pill good">Cả team đã nộp báo cáo</span>'}
        ${!reported.has(ME.id)?`<div style="margin-top:12px"><button class="btn primary" data-act="add" data-col="reports">+ Viết báo cáo của tôi</button></div>`:''}</div>
    </div>
  </div>`;
}

function staffFilter(col){const v=(S.f[col]||{}).staff||'';
  return `<select id="flt-staff-${col}" data-flt="${col}" data-k="staff" aria-label="Lọc theo nhân viên"><option value="">Tất cả nhân viên</option>${D.staff.map(s=>`<option value="${s.id}" ${s.id===v?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`;}
function searchBox(col,ph){return `<input type="search" id="flt-q-${col}" data-flt="${col}" data-k="q" placeholder="${ph}" value="${esc((S.f[col]||{}).q||'')}">`;}
const match=(r,q,keys)=>!q||keys.some(k=>String(r[k]||'').toLowerCase().includes(q.toLowerCase()));

function vTasks(){
  const f=S.f.tasks||{}, t=todayStr();
  let rows=D.tasks.filter(x=>!f.staff||x.staffId===f.staff);
  rows.sort((a,b)=>(PRIORITY.indexOf(a.priority)-PRIORITY.indexOf(b.priority))||((a.due||'9')<(b.due||'9')?-1:1));
  const col=s=>{const items=rows.filter(x=>(x.status||'Cần làm')===s);
    return `<div class="col"><h3><span>${s}</span><span class="muted">${items.length}</span></h3>${items.map(x=>{const od=x.due&&x.due<t&&s!=='Xong';
      return `<div class="card ${od?'overdue':''}" data-act="edit" data-col="tasks" data-id="${x.id}"><div class="t">${esc(x.title)}</div>
      <div class="meta"><span>${esc(staffName(x.staffId))}</span>${x.due?`<span class="${od?'neg':''}">· hạn ${dmy(x.due)}</span>`:''}
      <span class="pill ${x.priority==='Cao'?'bad':''}">${esc(x.priority||'Trung bình')}</span>
      ${canEdit('tasks',x)&&s!=='Xong'?`<button class="pill good" data-act="advance" data-id="${x.id}">${s==='Cần làm'?'Bắt đầu →':'Xong ✓'}</button>`:''}</div></div>`}).join('')||'<div class="small muted" style="padding:4px">Trống</div>'}</div>`};
  return needStaff()+`<div class="toolbar">${staffFilter('tasks')}<span class="spacer"></span>${addBtn('tasks','Giao việc')}</div>
  ${D.tasks.length?`<div class="board">${TASK_STATUS.map(col).join('')}</div>`:emptyBox('Chưa có công việc','Giao việc cho từng người, đặt hạn và theo dõi tiến độ tại đây.',addBtn('tasks','Giao việc đầu tiên'))}`;
}

function vReports(){
  const f=S.f.reports||{};
  const rows=D.reports.filter(inMonth).filter(r=>!f.staff||r.staffId===f.staff).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  return `<div class="toolbar">${staffFilter('reports')}<span class="spacer"></span>${addBtn('reports','Viết báo cáo hôm nay')}</div>
  ${rows.length?`<div class="list">${rows.map(r=>`<div class="report" data-act="edit" data-col="reports" data-id="${r.id}">
    <div class="head"><b>${esc(staffName(r.staffId))}</b><span class="muted">${dmy(r.date)}/${String(r.date).slice(0,4)}</span></div>
    <dl><dt>Đã làm</dt><dd>${esc(r.done)}</dd>${r.plan?`<dt>Ngày mai</dt><dd>${esc(r.plan)}</dd>`:''}${r.issue?`<dt>Vướng mắc</dt><dd class="neg">${esc(r.issue)}</dd>`:''}</dl></div>`).join('')}</div>`
  :emptyBox('Chưa có báo cáo trong tháng này','Mỗi người nộp một báo cáo cuối ngày: đã làm gì, mai làm gì, vướng ở đâu.',addBtn('reports','Viết báo cáo'))}`;
}

function vOrders(){
  const f=S.f.orders||{}, c=calc();
  const rows=c.orders.filter(o=>!f.staff||o.staffId===f.staff).filter(o=>!f.status||o.status===f.status)
    .filter(o=>match(o,f.q,['code','customer','phone','product','note'])).sort((a,b)=>a.date<b.date?1:-1);
  const counts=ORDER_STATUS.map(s=>`<span class="small muted">${s}: <b>${c.orders.filter(o=>(o.status||'Mới')===s).length}</b></span>`).join(' · ');
  return `<div class="toolbar">${searchBox('orders','Tìm mã đơn, khách, SĐT, sản phẩm…')}${staffFilter('orders')}
    <select id="flt-st-orders" data-flt="orders" data-k="status" aria-label="Trạng thái"><option value="">Mọi trạng thái</option>${ORDER_STATUS.map(s=>`<option ${s===f.status?'selected':''}>${s}</option>`).join('')}</select>
    ${addBtn('orders','Thêm đơn')}</div>
  <div style="margin-bottom:10px">${counts}</div>
  ${c.orders.length?`<div class="tablewrap"><table><thead><tr><th>Ngày</th><th>Mã</th><th>Khách hàng</th><th>Sản phẩm</th><th class="num">SL</th><th class="num">Thành tiền</th><th>Kênh</th><th>Trạng thái</th><th>Nhân viên</th></tr></thead>
    <tbody>${rows.map(o=>`<tr class="row" data-act="edit" data-col="orders" data-id="${o.id}"><td>${dmy(o.date)}</td><td>${esc(o.code)}</td><td>${esc(o.customer)}<div class="small muted">${esc(o.phone)}</div></td><td>${esc(o.product)}</td><td class="num">${nf(o.qty)}</td><td class="num">${vnd(o.amount)}</td><td>${esc(o.channel)}</td><td>${statusPill(o.status)}</td><td>${esc(staffName(o.staffId))}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="4">${rows.length} đơn đang hiển thị</td><td class="num">${nf(sum(rows,'qty'))}</td><td class="num">${vnd(sum(rows,'amount'))}</td><td colspan="3"></td></tr></tfoot></table></div>`
  :emptyBox('Chưa có đơn trong tháng này','Nhập đơn hằng ngày để tự tính doanh thu, hoa hồng và KPI.',addBtn('orders','Thêm đơn đầu tiên'))}`;
}

function vMoney(){
  const c=calc();
  const line=(l,v,cls='')=>`<tr><td>${l}</td><td class="num ${cls}">${vnd(v)}</td></tr>`;
  const cats=Object.entries(c.byCat).sort((a,b)=>b[1]-a[1]);
  const exps=[...c.exps].sort((a,b)=>a.date<b.date?1:-1);
  return `<div class="grid two">
    <div class="panel"><h2>Kết quả tháng ${S.month.slice(5)}/${S.month.slice(0,4)}</h2>
      <div class="tablewrap" style="border:0"><table><tbody>
      ${line('Doanh thu (không tính đơn hoàn/hủy)',c.revenue)}
      ${cats.map(([k,v])=>line('− '+esc(k),-v,'muted')).join('')||line('− Chi phí',0,'muted')}
      ${line('− Lương cứng',-c.people.reduce((t,p)=>t+p.base,0),'muted')}
      ${line('− Hoa hồng',-c.people.reduce((t,p)=>t+p.com,0),'muted')}
      </tbody><tfoot><tr><td>Lợi nhuận</td><td class="num ${c.profit<0?'neg':''}">${vnd(c.profit)}</td></tr></tfoot></table></div>
      <div class="small muted" style="margin-top:8px">Đã giao thành công: ${vnd(c.done)} · đang treo (mới + đang giao): ${vnd(c.revenue-c.done)}</div></div>
    <div class="panel"><h2>Bảng lương tháng</h2>${c.people.length?`<div class="tablewrap" style="border:0"><table><thead><tr><th>Nhân viên</th><th class="num">Lương cứng</th><th class="num">Hoa hồng</th><th class="num">Tổng</th></tr></thead>
      <tbody>${c.people.map(p=>`<tr><td>${esc(p.s.name)}<div class="small muted">${nf(p.s.commission||0)}% × ${short(p.rev)}</div></td><td class="num">${short(p.base)}</td><td class="num">${short(p.com)}</td><td class="num"><b>${vnd(p.pay)}</b></td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Tổng</td><td></td><td></td><td class="num">${vnd(c.payroll)}</td></tr></tfoot></table></div>`:'<div class="muted">Thêm nhân viên kèm lương cứng và % hoa hồng để tính lương.</div>'}</div>
  </div>
  <div class="toolbar" style="margin-top:18px"><h2 style="margin:0">Chi phí trong tháng</h2><span class="spacer"></span>${addBtn('expenses','Thêm khoản chi')}</div>
  ${exps.length?`<div class="tablewrap"><table><thead><tr><th>Ngày</th><th>Khoản chi</th><th>Nội dung</th><th>Người chi</th><th class="num">Số tiền</th></tr></thead>
   <tbody>${exps.map(e=>`<tr class="row" data-act="edit" data-col="expenses" data-id="${e.id}"><td>${dmy(e.date)}</td><td><span class="pill">${esc(e.category)}</span></td><td>${esc(e.note)}</td><td>${esc(staffName(e.staffId))}</td><td class="num">${vnd(e.amount)}</td></tr>`).join('')}</tbody>
   <tfoot><tr><td colspan="4">Tổng chi</td><td class="num">${vnd(c.expTotal)}</td></tr></tfoot></table></div>`
  :emptyBox('Chưa có khoản chi nào','Ghi tiền quảng cáo, nhập hàng, ship… để ra lợi nhuận thật.','')}`;
}

function chanCards(){
  const t=D.channels; if(!t.length) return '';
  return `<div class="chans">${t.map(ch=>{const logs=D.follows.filter(f=>f.channelId===ch.id&&inMonth(f)).sort((a,b)=>a.date<b.date?-1:1);
    const d=logs.length>1?(+logs[logs.length-1].followers)-(+logs[0].followers):null;
    return `<div class="panel chan"><div class="chan-h"><span class="pill ${ch.platform==='TikTok'?'tt':'fb'}">${esc(ch.platform)}</span>${ch.error&&isAdmin()?'<span class="pill bad" title="'+esc(ch.error)+'">Lỗi</span>':''}</div>
      <div class="chan-n">${esc(ch.name)}</div><div class="chan-f">${short(ch.followers)}<small> follower</small></div>
      <div class="small ${d>0?'up':d<0?'neg':'muted'}">${d===null?'Chưa đủ dữ liệu tháng này':(d>=0?'+':'')+nf(d)+' trong tháng'}</div>
      <div class="small muted">${esc(staffName(ch.staffId))}${ch.lastSync?' · cập nhật '+new Date(ch.lastSync).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}):''}</div></div>`}).join('')}</div>`;
}

function vViews(){
  const f=S.f.views||{}, c=calc();
  const rows=c.views.filter(v=>!f.staff||v.staffId===f.staff).filter(v=>!f.platform||v.platform===f.platform).filter(v=>!f.src||(f.src==='auto')===!!v.auto).filter(v=>match(v,f.q,['title','link'])).sort((a,b)=>(+b.views||0)-(+a.views||0));
  const plats=[...new Set([...PLATFORMS,...c.views.map(v=>v.platform)].filter(Boolean))];
  const byP=plats.map(p=>{const r=c.views.filter(v=>v.platform===p);return {p,n:r.length,v:sum(r,'views')}}).filter(x=>x.n);
  const link=v=>v.link?`<div class="small"><a href="${esc(/^https?:\/\//.test(v.link)?v.link:'https://'+v.link)}" target="_blank" rel="noopener" data-stop="1">Mở bài ↗</a></div>`:'';
  return `${chanCards()}<div class="toolbar">${searchBox('views','Tìm tên video / bài…')}${staffFilter('views')}
    <select id="flt-pf-views" data-flt="views" data-k="platform" aria-label="Nền tảng"><option value="">Mọi nền tảng</option>${plats.map(p=>`<option ${p===f.platform?'selected':''}>${p}</option>`).join('')}</select>
    <select id="flt-src-views" data-flt="views" data-k="src" aria-label="Nguồn"><option value="">Tự động + nhập tay</option><option value="auto" ${f.src==='auto'?'selected':''}>Chỉ tự động</option><option value="manual" ${f.src==='manual'?'selected':''}>Chỉ nhập tay</option></select>
    ${addBtn('views','Nhập tay')}</div>
  ${byP.length?`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">${byP.map(x=>`<span class="pill v">${esc(x.p)}: ${short(x.v)} view · ${x.n} bài</span>`).join('')}</div>`:''}
  ${c.views.length?`<div class="tablewrap"><table><thead><tr><th>Ngày đăng</th><th>Video / bài</th><th>Kênh</th><th>Người làm</th><th class="num">View</th><th class="num">Bình luận</th><th class="num">Thích</th></tr></thead>
   <tbody>${rows.map(v=>`<tr ${v.auto?'':`class="row" data-act="edit" data-col="views" data-id="${v.id}"`}><td>${dmy(v.date)}</td><td>${esc(v.title)}${link(v)}</td><td><span class="pill ${v.platform==='TikTok'?'tt':v.platform==='Facebook'?'fb':'v'}">${esc(v.platform)}</span>${v.auto?`<div class="small muted">${esc(chanName(v.channelId))}</div>`:'<div class="small muted">Nhập tay</div>'}</td><td>${esc(staffName(v.staffId))}</td><td class="num"><b>${v.views===''?'—':nf(v.views)}</b></td><td class="num">${v.auto?nf(v.comments):'—'}</td><td class="num">${v.auto?nf(v.likes):'—'}</td></tr>`).join('')}</tbody>
   <tfoot><tr><td colspan="4">${rows.length} video / bài</td><td class="num">${nf(sum(rows,'views'))}</td><td class="num">${nf(sum(rows,'comments'))}</td><td class="num">${nf(sum(rows,'likes'))}</td></tr></tfoot></table></div>
   <div class="small muted" style="margin-top:8px">Bài từ kênh đã kết nối tự cập nhật mỗi giờ. Kênh chưa kết nối thì bấm "Nhập tay"; khi view tăng, bấm vào dòng để sửa con số.</div>`
  :emptyBox('Chưa có video / bài nào trong tháng',isAdmin()?'Vào mục Kết nối MXH để tự kéo bài từ fanpage và TikTok, hoặc nhập tay từng bài.':'Bài từ các kênh đã kết nối sẽ tự hiện ở đây.',addBtn('views','Nhập tay'))}`;
}

function vChannels(){
  const st=SETTINGS||{};
  const keyForm=(kind,idLab,secLab,idVal,ready)=>`<div class="fields" style="margin-bottom:10px">
      <div class="fld"><label for="${kind}-id">${idLab}</label><input id="${kind}-id" value="${esc(idVal)}" autocomplete="off"></div>
      <div class="fld"><label for="${kind}-sec">${secLab}</label><input id="${kind}-sec" type="password" placeholder="${ready?'Đã lưu, để trống nếu không đổi':''}" autocomplete="off"></div></div>
    <button class="btn" data-act="keys" data-kind="${kind}">Lưu khóa</button> ${ready?'<span class="pill good">Đã lưu</span>':'<span class="pill warn">Chưa có</span>'}`;
  return `<div class="grid two">
   <div class="panel"><h2>Facebook fanpage</h2>
     <p class="small muted" style="margin-top:-6px">Bước 1: lưu App ID và App Secret của ứng dụng Meta.</p>
     ${keyForm('fb','App ID','App Secret',st.fbAppId,st.fbReady)}
     <p class="small muted" style="margin-top:16px">Bước 2: dán mã User access token lấy từ Graph API Explorer, rồi bấm kết nối. Mọi fanpage bạn quản lý sẽ được thêm cùng lúc.</p>
     <div class="fld"><textarea id="fb-token" placeholder="EAAG…" style="min-height:60px"></textarea></div>
     <div style="margin-top:10px"><button class="btn primary" data-act="fbconnect" ${st.fbReady?'':'disabled'}>Kết nối fanpage</button></div></div>
   <div class="panel"><h2>TikTok</h2>
     <p class="small muted" style="margin-top:-6px">Bước 1: lưu Client key và Client secret của ứng dụng TikTok.</p>
     ${keyForm('tt','Client key','Client secret',st.ttKey,st.ttReady)}
     <p class="small muted" style="margin-top:16px">Redirect URI cần khai báo trong ứng dụng TikTok:</p>
     <div class="copyrow"><code id="redir">${esc(st.redirectUri)}</code><button class="btn" data-act="copy">Chép</button></div>
     <p class="small muted" style="margin-top:12px">Bước 2: tạo link, mở link, đăng nhập đúng tài khoản TikTok của kênh rồi bấm Cho phép. Làm lại cho từng kênh.</p>
     <button class="btn primary" data-act="ttlink" ${st.ttReady?'':'disabled'}>Tạo link kết nối TikTok</button>
     <div id="ttlink-out" style="margin-top:10px">${TTLINK?`<a class="btn" href="${esc(TTLINK)}" target="_blank" rel="noopener">Mở trang đăng nhập TikTok ↗</a> <span class="small muted">Link dùng được 15 phút.</span>`:''}</div></div>
  </div>
  <div class="toolbar" style="margin-top:18px"><h2 style="margin:0">Kênh đã kết nối (${D.channels.length})</h2><span class="spacer"></span>
    ${st.autoSync?'<span class="pill good">Tự cập nhật mỗi giờ: đang bật</span>':'<span class="pill warn" title="Chạy hàm batTuDongCapNhat trong Apps Script một lần">Tự cập nhật: chưa bật</span>'}
    <button class="btn" data-act="syncnow" ${D.channels.length?'':'disabled'}>Đồng bộ ngay</button></div>
  ${D.channels.length?`<div class="tablewrap"><table><thead><tr><th>Kênh</th><th class="num">Follower</th><th>Người phụ trách</th><th>Cập nhật</th><th>Trạng thái</th><th></th></tr></thead><tbody>
   ${D.channels.map(ch=>`<tr><td><span class="pill ${ch.platform==='TikTok'?'tt':'fb'}">${esc(ch.platform)}</span> <b>${esc(ch.name)}</b></td><td class="num">${nf(ch.followers)}</td>
     <td><select id="chs-${ch.id}" data-chstaff="${ch.id}" aria-label="Người phụ trách"><option value="">— Chưa gán —</option>${D.staff.map(s=>`<option value="${s.id}" ${s.id===ch.staffId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></td>
     <td class="small">${ch.lastSync?new Date(ch.lastSync).toLocaleString('vi-VN'):'—'}</td>
     <td>${ch.error?`<span class="pill bad">Lỗi</span><div class="small neg" style="max-width:260px">${esc(ch.error)}</div>`:'<span class="pill good">Đang chạy</span>'}</td>
     <td><button class="btn danger" data-act="chdel" data-id="${ch.id}">Gỡ</button></td></tr>`).join('')}</tbody></table></div>
   <div class="small muted" style="margin-top:8px">Gán người phụ trách để view của kênh được tính vào KPI người đó.</div>`
  :emptyBox('Chưa kết nối kênh nào','Làm theo hai bước ở trên cho Facebook hoặc TikTok.','')}`;
}

function vKpi(){
  const c=calc(), people=isAdmin()?c.people:c.people.filter(p=>p.s.id===ME.id);
  if(!people.length) return emptyBox('Chưa có nhân viên','Thêm nhân viên và đặt chỉ tiêu tháng để xem KPI.',addBtn('staff'));
  const item=(lab,v,t,fmt,cls)=>{const p=pct(v,t);return `<div><div class="k">${lab}</div><div class="n">${fmt(v)} <span class="muted small">/ ${t?fmt(t):'chưa đặt'}</span></div>
    <div class="bar ${p>=100?'done':cls}"><span style="width:${Math.min(p||0,100)}%"></span></div><div class="small ${p>=100?'':'muted'}" style="${p>=100?'color:var(--good)':''}">${p===null?'—':p+'%'}</div></div>`};
  return `<div class="grid">${people.map(p=>{const s=p.s, ps=[pct(p.orders,+s.kpiOrders),pct(p.rev,+s.kpiRevenue),pct(p.videos,+s.kpiVideos),pct(p.views,+s.kpiViews)].filter(x=>x!==null);
    const avg=ps.length?Math.round(ps.reduce((a,b)=>a+Math.min(b,150),0)/ps.length):null;
    return `<div class="panel kpicard"><div class="who"><div><span class="nm">${esc(s.name)}</span> <span class="muted small">${esc(s.role)}</span></div>
      <div><span class="muted small">Hoàn thành chung </span><span class="big" style="color:${avg===null?'var(--muted)':avg>=100?'var(--good)':avg>=70?'var(--warn)':'var(--bad)'}">${avg===null?'—':avg+'%'}</span></div></div>
      <div class="kpi">${item('Số đơn',p.orders,+s.kpiOrders,nf,'')}${item('Doanh thu',p.rev,+s.kpiRevenue,short,'')}${item('Video / bài',p.videos,+s.kpiVideos,nf,'v')}${item('Lượt view',p.views,+s.kpiViews,short,'v')}</div></div>`}).join('')}</div>
  <div class="small muted" style="margin-top:10px">Đơn và doanh thu tính theo "Nhân viên chốt" của đơn (trừ đơn hoàn/hủy). Video và view tính theo "Người làm".${isAdmin()?' Đặt chỉ tiêu trong mục Nhân viên.':''}</div>`;
}

function vStaff(){
  return `<div class="toolbar"><span class="muted">Mỗi người đăng nhập bằng mã PIN riêng. Quyền "Quản lý" xem được tiền, lương và sửa mọi dữ liệu.</span><span class="spacer"></span>${addBtn('staff')}</div>
  <div class="tablewrap"><table><thead><tr><th>Họ tên</th><th>Quyền</th><th>Mã PIN</th><th class="num">Lương cứng</th><th class="num">Hoa hồng</th><th class="num">KPI đơn</th><th class="num">KPI doanh thu</th><th class="num">KPI video</th><th class="num">KPI view</th></tr></thead>
   <tbody>${[...D.staff].sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'vi')).map(s=>`<tr class="row" data-act="edit" data-col="staff" data-id="${s.id}"><td><b>${esc(s.name)}</b>${s.id===ME.id?' <span class="pill acc">Bạn</span>':''}</td><td>${esc(s.role)}</td><td class="muted">${esc(s.pin)}</td><td class="num">${vnd(s.baseSalary)}</td><td class="num">${nf(s.commission||0)}%</td><td class="num">${nf(s.kpiOrders)}</td><td class="num">${short(s.kpiRevenue)}</td><td class="num">${nf(s.kpiVideos)}</td><td class="num">${short(s.kpiViews)}</td></tr>`).join('')}</tbody></table></div>`;
}

const VIEWS={channels:vChannels,overview:vOverview,tasks:vTasks,reports:vReports,orders:vOrders,money:vMoney,views:vViews,kpi:vKpi,staff:vStaff};

function render(){
  if(!ME) return;
  if(!VIEWS[S.view]||(!isAdmin()&&ADMIN_VIEWS.includes(S.view))) S.view='overview';
  const a=document.activeElement, aid=a&&a.id&&a.closest('#view')?a.id:null, sel=aid&&a.selectionStart!=null?[a.selectionStart,a.selectionEnd]:null;
  document.querySelectorAll('#nav [data-view]').forEach(b=>{
    b.hidden=!isAdmin()&&ADMIN_VIEWS.includes(b.dataset.view);
    b.dataset.view===S.view?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current');});
  document.getElementById('title').textContent=TITLES[S.view];
  document.getElementById('month').value=S.month;
  const t=todayStr(), od=D.tasks.filter(x=>x.status!=='Xong'&&x.due&&x.due<t&&(isAdmin()||x.staffId===ME.id)).length;
  document.getElementById('nb-tasks').innerHTML=od?`<span class="badge" title="Việc quá hạn">${od}</span>`:'';
  document.getElementById('who').textContent=ME.name+' · '+ME.role;
  document.getElementById('view').innerHTML=VIEWS[S.view]();
  if(aid){const e=document.getElementById(aid);if(e){e.focus();if(sel)try{e.setSelectionRange(sel[0],sel[1])}catch(_){}}}
}

/* ---------- server ---------- */
/* ====== CẤU HÌNH: dán link Ứng dụng web Apps Script (đuôi /exec) vào giữa hai dấu nháy ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbx1wuWcm4P-9-BbAheuK4QcvXFh7mDTYoYz0YonEBszMtpxO2K5h0Yt_QapaexKL-DD_w/exec';
/* ========================================================================================== */
async function run(fn,...args){
  if(!/^https:\/\/script\.google\.com\//.test(API_URL)) throw new Error('Chưa cấu hình API_URL trong file index.html.');
  let r;
  try{ r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})}); }
  catch(e){ throw new Error('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.'); }
  let j; try{ j=await r.json(); }catch(e){ throw new Error('Máy chủ trả về dữ liệu lạ. Kiểm tra lại API_URL và quyền "Bất kỳ ai".'); }
  if(!j.ok) throw new Error(j.error); return j.result;
}
const msg=e=>String((e&&e.message)||e||'Có lỗi xảy ra.').replace(/^Error:\s*/,'').replace(/^Exception:\s*/,'');
function apply(r){ME=r.me;SETTINGS=r.settings||null;COLS.forEach(c=>D[c]=(r.data&&r.data[c])||[]);document.getElementById('sync').textContent='Cập nhật lúc '+new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});render();}
let busy=false;
async function refresh(){
  if(!PIN||busy||!document.getElementById('modal').hidden||document.hidden||S.view==='channels') return;
  busy=true;
  try{apply(await run('load',PIN));}
  catch(e){const m=msg(e);if(/PIN/.test(m)){logout();toast('Mã PIN đã thay đổi. Đăng nhập lại.');}}
  finally{busy=false;}
}
setInterval(refresh,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});

/* ---------- login ---------- */
function showLogin(first){
  document.getElementById('app').hidden=true;
  const L=document.getElementById('login'); L.hidden=false;
  document.getElementById('login-first').hidden=!first;
  document.getElementById('login-pin').hidden=!!first;
  document.getElementById('login-err').hidden=true;
  setTimeout(()=>{const i=L.querySelector(first?'#su-name':'#pin');i&&i.focus();},50);
}
function enter(r,pin){
  PIN=pin;try{localStorage.setItem('md-pin',pin)}catch(_){}
  document.getElementById('login').hidden=true;document.getElementById('app').hidden=false;apply(r);
}
function loginErr(m){const e=document.getElementById('login-err');e.textContent=m;e.hidden=false;}
function logout(){PIN='';ME=null;try{localStorage.removeItem('md-pin')}catch(_){}document.getElementById('pin').value='';showLogin(false);}
document.getElementById('login-pin').addEventListener('submit',async e=>{
  e.preventDefault();const pin=document.getElementById('pin').value.trim(),b=e.target.querySelector('button');
  if(!pin){loginErr('Nhập mã PIN của bạn.');return;}
  b.disabled=true;b.textContent='Đang vào…';
  try{enter(await run('load',pin),pin);}catch(err){loginErr(msg(err));}
  finally{b.disabled=false;b.textContent='Vào hệ thống';}
});
document.getElementById('login-first').addEventListener('submit',async e=>{
  e.preventDefault();const n=document.getElementById('su-name').value.trim(),p=document.getElementById('su-pin').value.trim(),p2=document.getElementById('su-pin2').value.trim(),b=e.target.querySelector('button');
  if(!n){loginErr('Nhập tên của bạn.');return;} if(!/^\d{4,8}$/.test(p)){loginErr('Mã PIN phải gồm 4–8 chữ số.');return;} if(p!==p2){loginErr('Hai lần nhập PIN không khớp.');return;}
  b.disabled=true;
  try{enter(await run('setupAdmin',n,p),p);toast('Đã tạo tài khoản quản lý');}catch(err){loginErr(msg(err));}
  finally{b.disabled=false;}
});
async function boot(){
  let saved='';try{saved=localStorage.getItem('md-pin')||''}catch(_){}
  try{
    if(saved){try{enter(await run('load',saved),saved);return;}catch(_){try{localStorage.removeItem('md-pin')}catch(__){}}}
    const st=await run('status'); showLogin(!st.hasStaff);
  }catch(e){showLogin(false);loginErr('Không kết nối được máy chủ: '+msg(e));}
  finally{document.getElementById('boot').hidden=true;}
}

/* ---------- form ---------- */
let editing=null;
function openForm(col,id){
  const rec=id?D[col].find(x=>x.id===id):null, can=canEdit(col,rec);
  if(!rec&&!can) return;
  editing={col,id:id||null,rec};
  document.getElementById('form-title').textContent=(rec?(can?'Sửa ':'Xem '):'Thêm ')+NAMES[col];
  const wrap=document.getElementById('form-fields');
  wrap.innerHTML=FIELDS[col].map(f=>{
    let v=rec?rec[f.k]:(f.d!=null?f.d:f.t==='date'?todayStr():f.t==='sel'?f.o[0]:'');
    if(!rec&&f.t==='staff'&&col!=='expenses'){const fs=(S.f[col]||{}).staff;v=fs||ME.id;}
    if(v==null)v='';
    const lock=!can||(col==='reports'&&f.k==='staffId'&&!isAdmin());
    const id='f_'+f.k, ro=lock?' disabled':'', lab=`<label for="${id}">${f.l}${f.req?' *':''}</label>`;
    let inp;
    if(f.t==='area') inp=`<textarea id="${id}" name="${f.k}"${ro}>${esc(v)}</textarea>`;
    else if(f.t==='sel') inp=`<select id="${id}" name="${f.k}"${ro}>${f.o.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
    else if(f.t==='staff') inp=`<select id="${id}" name="${f.k}"${ro}><option value="">— Chọn —</option>${D.staff.map(s=>`<option value="${s.id}" ${s.id===v?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`;
    else inp=`<input id="${id}" name="${f.k}" type="${f.t==='num'?'number':f.t}" ${f.t==='num'?`inputmode="decimal" min="0" step="${f.step||'any'}"`:''}${f.k==='pin'?' inputmode="numeric" autocomplete="off"':''} value="${esc(v===0&&!rec&&f.t==='num'?'':v)}" ${f.ph?`placeholder="${f.ph}"`:''}${ro}>`;
    return `<div class="fld ${f.wide?'wide':''}">${lab}${inp}</div>`}).join('');
  const del=document.getElementById('form-del'); del.hidden=!rec||!can; del.classList.remove('armed'); del.textContent='Xóa';
  document.getElementById('form-save').hidden=!can;
  document.getElementById('form-cancel').textContent=can?'Hủy':'Đóng';
  document.getElementById('form-err').hidden=true;
  document.getElementById('modal').hidden=false;
  setTimeout(()=>{const first=wrap.querySelector('input:not([disabled]),select:not([disabled]),textarea:not([disabled])');first&&first.focus()},30);
}
function closeForm(){document.getElementById('modal').hidden=true;editing=null;}
function formErr(m){const e=document.getElementById('form-err');e.textContent=m;e.hidden=false;}

document.getElementById('form').addEventListener('submit',async e=>{
  e.preventDefault(); if(!editing) return;
  const {col,id}=editing, fm=e.target, obj={};
  for(const f of FIELDS[col]){const el=fm.elements[f.k];let v=el.value.trim();
    if(f.req&&v===''){formErr(`Vui lòng nhập "${f.l}".`);el.focus();return;}
    if(f.t==='num'){v=v===''?0:Number(v.replace(',','.'));if(!isFinite(v)||v<0){formErr(`"${f.l}" phải là số không âm.`);return;}}
    obj[f.k]=v;}
  if(col==='staff'&&!/^\d{4,8}$/.test(obj.pin)){formErr('Mã PIN phải gồm 4–8 chữ số.');return;}
  const btn=document.getElementById('form-save'); btn.disabled=true; btn.textContent='Đang lưu…';
  try{const r=await run('save',PIN,col,id,obj); if(col==='staff'&&id===ME.id){PIN=obj.pin;try{localStorage.setItem('md-pin',PIN)}catch(_){}}
    closeForm();apply(r);toast(id?'Đã lưu thay đổi':'Đã thêm '+NAMES[col]);}
  catch(err){formErr(msg(err));}
  finally{btn.disabled=false;btn.textContent='Lưu';}
});
document.getElementById('form-cancel').onclick=closeForm;
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeForm();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('modal').hidden)closeForm();});
document.getElementById('form-del').onclick=async e=>{
  const b=e.currentTarget;
  if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Bấm lần nữa để xóa';return;}
  const {col,id}=editing; b.disabled=true;
  try{const r=await run('remove',PIN,col,id);closeForm();apply(r);toast('Đã xóa');}catch(err){formErr(msg(err));}
  finally{b.disabled=false;}
};

/* ---------- events ---------- */
let tt=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600);}
function shiftMonth(d){let [y,m]=S.month.split('-').map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}S.month=y+'-'+pad(m);render();}
document.addEventListener('click',async e=>{
  if(e.target.closest('[data-stop]'))return;
  const nv=e.target.closest('[data-view]');
  if(nv){S.view=nv.dataset.view;try{localStorage.setItem('md-view',S.view)}catch(_){}render();window.scrollTo(0,0);return;}
  const a=e.target.closest('[data-act]'); if(!a)return;
  const act=a.dataset.act;
  if(act==='mprev')shiftMonth(-1); else if(act==='mnext')shiftMonth(1);
  else if(act==='logout')logout();
  else if(act==='reload'){refresh();toast('Đang tải dữ liệu mới…');}
  else if(act==='add')openForm(a.dataset.col);
  else if(act==='advance'){e.stopPropagation();const x=D.tasks.find(t=>t.id===a.dataset.id);if(!x)return;
    const next=x.status==='Đang làm'?'Xong':'Đang làm';a.disabled=true;
    try{apply(await run('save',PIN,'tasks',x.id,{...x,status:next}));toast(next==='Xong'?'Đã xong việc':'Đã chuyển sang Đang làm');}catch(err){toast(msg(err));a.disabled=false;}}
  else if(act==='edit')openForm(a.dataset.col,a.dataset.id);
  else if(act==='copy'){const t=document.getElementById('redir').textContent;try{await navigator.clipboard.writeText(t);toast('Đã chép');}catch(_){const r=document.createRange();r.selectNodeContents(document.getElementById('redir'));const sl=getSelection();sl.removeAllRanges();sl.addRange(r);toast('Đã chọn sẵn, bấm Ctrl+C để chép');}}
  else if(act==='keys'){const k=a.dataset.kind;await act_(a,'saveSocialKeys',[k,document.getElementById(k+'-id').value,document.getElementById(k+'-sec').value],'Đã lưu khóa');}
  else if(act==='fbconnect'){const t=document.getElementById('fb-token').value.trim();if(!t){toast('Dán mã truy cập vào ô trước');return;}await act_(a,'connectFacebook',[t],'Đã kết nối fanpage');}
  else if(act==='ttlink'){a.disabled=true;try{TTLINK=await run('tiktokAuthUrl',PIN);render();}catch(err){toast(msg(err));}finally{a.disabled=false;}}
  else if(act==='syncnow')await act_(a,'syncNow',[],'Đã đồng bộ xong');
  else if(act==='chdel'){if(!a.classList.contains('armed')){a.classList.add('armed');a.textContent='Chắc chắn gỡ?';return;}await act_(a,'removeChannel',[a.dataset.id],'Đã gỡ kênh');}
});
async function act_(btn,fn,args,ok){const old=btn.textContent;btn.disabled=true;btn.textContent='Đang xử lý…';
  try{apply(await run(fn,PIN,...args));toast(ok);}catch(err){toast(msg(err));btn.disabled=false;btn.textContent=old;}}
document.addEventListener('change',async e=>{const el=e.target;if(!el.dataset||!el.dataset.chstaff)return;
  el.disabled=true;try{apply(await run('saveChannel',PIN,el.dataset.chstaff,el.value,true));toast('Đã gán người phụ trách');}catch(err){toast(msg(err));el.disabled=false;}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.flt){const c=el.dataset.flt;S.f[c]=S.f[c]||{};S.f[c][el.dataset.k]=el.value;render();}});
document.getElementById('month').addEventListener('change',e=>{if(e.target.value){S.month=e.target.value;render();}});

boot();

</script>
