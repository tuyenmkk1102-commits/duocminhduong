<style>
/* Layout: cột điều hướng trái + vùng làm việc; điện thoại chuyển thành thanh tab cuộn ngang */
:root{
  --bg:#F4F4EE; --surface:#FFFFFF; --sunk:#ECEDE3; --ink:#1E2114; --muted:#646856; --line:#E0E2D4;
  --accent:#5C6A10; --accent-ink:#FFFFFF; --accent-soft:#EBEED8;
  --views:#1E6A73; --views-soft:#DFEFF0;
  --good:#2B7A3E; --good-soft:#E2F1E5; --warn:#A06A10; --warn-soft:#F8EED7; --bad:#B3372B; --bad-soft:#F8E2DF;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Saira Condensed","Be Vietnam Pro",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121409; --surface:#1B1E12; --sunk:#16180E; --ink:#ECEEDF; --muted:#A3A78F; --line:#2D311F;
  --accent:#B6C75A; --accent-ink:#151807; --accent-soft:#2A3015;
  --views:#6FC2CB; --views-soft:#16302F;
  --good:#5CC47A; --good-soft:#16301C; --warn:#E3AE4D; --warn-soft:#33270F; --bad:#F07264; --bad-soft:#3A1C18;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121409; --surface:#1B1E12; --sunk:#16180E; --ink:#ECEEDF; --muted:#A3A78F; --line:#2D311F;
  --accent:#B6C75A; --accent-ink:#151807; --accent-soft:#2A3015;
  --views:#6FC2CB; --views-soft:#16302F;
  --good:#5CC47A; --good-soft:#16301C; --warn:#E3AE4D; --warn-soft:#33270F; --bad:#F07264; --bad-soft:#3A1C18;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px 18px;margin-bottom:8px;border-bottom:1px solid var(--line);font-family:var(--display);font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1;color:var(--accent)}
.brand img{width:56px;height:auto;background:#FFFFFF;border-radius:10px;padding:4px;flex:none}
.brand small{display:block;font-family:var(--font);font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:0;text-transform:none;margin-top:3px}
nav.side button{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
nav.side button:hover{background:var(--sunk);color:var(--ink)}
nav.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.badge{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--bad);color:var(--surface)}
.conn{margin-top:auto;font-size:12px;color:var(--muted);padding:10px}
.conn i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.conn.live i{background:var(--good)} .conn.local i{background:var(--warn)}
main{padding-block:22px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0;max-width:1240px;width:100%}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-family:var(--display);font-size:30px;font-weight:800;text-transform:uppercase;letter-spacing:.01em;margin:0;line-height:1.1;text-wrap:balance;color:var(--accent)}
h2{font-size:15px;font-weight:700;margin:0 0 12px}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:3px}
.month input{border:0;background:none;padding:5px 6px;font-weight:600}
.iconbtn{border:0;background:none;width:32px;height:32px;border-radius:7px;cursor:pointer;font-size:16px;color:var(--muted)}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-weight:500}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.tile .lab{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.tile .val{font-family:var(--display);font-size:32px;font-weight:700;letter-spacing:.01em;margin-top:2px;line-height:1.1}
.tile .sub{font-size:12px;color:var(--muted);margin-top:4px}
.tile.money .val{color:var(--accent)} .tile.views .val{color:var(--views)}
.neg{color:var(--bad)!important}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.toolbar input[type=search]{flex:1 1 200px;min-width:0}
.toolbar .spacer{flex:1}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer} tbody tr.row:hover td{background:var(--sunk)}
td.num,th.num{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;background:var(--sunk)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.v{background:var(--views-soft);color:var(--views)}
button.pill{border:0;cursor:pointer}
.muted{color:var(--muted)} .small{font-size:12px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;min-width:0}
.col h3{font-size:13px;margin:2px 4px 10px;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--muted)}
.card .t{font-weight:600;overflow-wrap:anywhere}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted)}
.card.overdue{border-left:3px solid var(--bad)}
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.report:hover{border-color:var(--muted)}
.rp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-top:14px}
.rp-card{padding:14px 16px}.rp-card.has-issue{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.rp-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}.rp-head>div{min-width:0}.rp-head .btn{padding:6px 12px}.rp-head .spacer{flex:1}
.rp-av{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.rp-sec{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}.rp-head+.rp-sec{border-top:0;margin-top:0;padding-top:0}
.rp-lab{font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:flex;gap:6px;align-items:center}
.rp-txt{white-space:pre-wrap;line-height:1.5}.rp-issue .rp-lab,.rp-issue .rp-txt{color:var(--bad)}
.rp-auto{display:flex;gap:8px;align-items:flex-start;margin-top:4px}.rp-auto ul{margin:0;padding-left:16px}.rp-auto .tag{flex:0 0 auto}
.rp-tasks{list-style:none;margin:0;padding:0;display:grid;gap:6px}.rp-tasks li{display:flex;gap:8px}.rp-tasks .ok{color:var(--good,#2B7A3E);font-weight:700}
.report .head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.report dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;margin:0}
.report dt{color:var(--muted);font-size:12px;font-weight:600;padding-top:1px}
.report dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:5px}
.bar span{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.v span{background:var(--views)} .bar.done span{background:var(--good)}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi .k{font-size:12px;color:var(--muted)} .kpi .n{font-weight:600}
.kpicard{display:grid;gap:12px}
.kpicard .who{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.who .nm{font-weight:700;font-size:15px}
.big{font-family:var(--display);font-size:26px;font-weight:700}
.list{display:grid;gap:8px}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{min-width:0;overflow-wrap:anywhere}
svg text{fill:var(--muted);font-family:var(--font);font-size:11px}

<script>
/* ---------- Ghi file Excel có định dạng (không cần thư viện ngoài) ---------- */
const XW=(()=>{
  const xe=s=>String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const colL=n=>{let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;};
  const ref=(r,c)=>colL(c)+(r+1);
  let CRC=null;
  const crc32=b=>{if(!CRC){CRC=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;CRC[n]=c>>>0;}}
    let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
  function zip(files){
    const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
    const u16=v=>[v&255,(v>>>8)&255], u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
    files.forEach(([name,txt])=>{const nb=enc.encode(name), d=enc.encode(txt), c=crc32(d);
      const h=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(d.length),...u32(d.length),...u16(nb.length),...u16(0)]);
      parts.push(h,nb,d);
      cen.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(d.length),...u32(d.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
      off+=h.length+nb.length+d.length;});
    const cs=cen.reduce((t,x)=>t+x.length,0);
    const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)]);
    const all=[...parts,...cen,end], out=new Uint8Array(all.reduce((t,x)=>t+x.length,0));let p=0;all.forEach(x=>{out.set(x,p);p+=x.length;});return out;
  }
  /* style: {b,i,sz,color,fill,h,v,wrap,border:'all'|'thin'|'none',nf} */
  function book(){
    const sheets=[], fonts=[], fills=['<fill><patternFill patternType="none"/></fill>','<fill><patternFill patternType="gray125"/></fill>'],
      borders=['<border><left/><right/><top/><bottom/><diagonal/></border>'], numFmts=[], xfs=[], xfKey={};
    const font=s=>{const x=`<font>${s.b?'<b/>':''}${s.i?'<i/>':''}<sz val="${s.sz||10}"/><color rgb="FF${s.color||'222222'}"/><name val="Arial"/><family val="2"/></font>`;let i=fonts.indexOf(x);if(i<0){fonts.push(x);i=fonts.length-1;}return i;};
    const fill=s=>{if(!s.fill)return 0;const x=`<fill><patternFill patternType="solid"><fgColor rgb="FF${s.fill}"/><bgColor indexed="64"/></patternFill></fill>`;let i=fills.indexOf(x);if(i<0){fills.push(x);i=fills.length-1;}return i;};
    const border=s=>{if(!s.border)return 0;const c=s.bc||'BFBFBF', e=`style="thin"><color rgb="FF${c}"/>`;
      const x=`<border><left ${e}</left><right ${e}</right><top ${e}</top><bottom ${e}</bottom><diagonal/></border>`;let i=borders.indexOf(x);if(i<0){borders.push(x);i=borders.length-1;}return i;};
    const numFmt=s=>{if(!s.nf)return 0;let i=numFmts.indexOf(s.nf);if(i<0){numFmts.push(s.nf);i=numFmts.length-1;}return 164+i;};
    font({});
    const xf=s=>{s=s||{};const k=JSON.stringify(s);if(xfKey[k]!=null)return xfKey[k];
      const f=font(s),fl=fill(s),bd=border(s),nf=numFmt(s);
      const al=(s.h||s.v||s.wrap)?`<alignment${s.h?` horizontal="${s.h}"`:''} vertical="${s.v||'center'}"${s.wrap?' wrapText="1"':''}/>`:'<alignment vertical="center"/>';
      xfs.push(`<xf numFmtId="${nf}" fontId="${f}" fillId="${fl}" borderId="${bd}" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"${nf?' applyNumberFormat="1"':''}>${al}</xf>`);
      return xfKey[k]=xfs.length-1;};
    xf({});
    function sheet(name){
      name=String(name).replace(/[\[\]:*?\/\\]/g,' ').slice(0,31)||'Sheet';let n=name,k=2;while(sheets.some(s=>s.name.toLowerCase()===n.toLowerCase()))n=name.slice(0,28)+' '+(k++);
      const sh={name:n,rows:{},merges:[],cols:{},heights:{},freeze:null,landscape:false,
        set(r,c,v,s){(this.rows[r]=this.rows[r]||{})[c]={v,x:xf(s)};return this;},
        merge(r1,c1,r2,c2,v,s){this.set(r1,c1,v,s);for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)if(r!==r1||c!==c1)this.set(r,c,'',s);this.merges.push(ref(r1,c1)+':'+ref(r2,c2));return this;},
        width(c,w){this.cols[c]=w;return this;}, height(r,h){this.heights[r]=h;return this;}};
      sheets.push(sh);return sh;
    }
    function sheetXml(sh){
      const rs=Object.keys(sh.rows).map(Number).sort((a,b)=>a-b);
      const data=rs.map(r=>{const cs=Object.keys(sh.rows[r]).map(Number).sort((a,b)=>a-b);
        return `<row r="${r+1}"${sh.heights[r]?` ht="${sh.heights[r]}" customHeight="1"`:''}>${cs.map(c=>{const o=sh.rows[r][c], a=ref(r,c);
          if(o.v===''||o.v==null)return `<c r="${a}" s="${o.x}"/>`;
          if(typeof o.v==='number'&&isFinite(o.v))return `<c r="${a}" s="${o.x}"><v>${o.v}</v></c>`;
          return `<c r="${a}" s="${o.x}" t="inlineStr"><is><t xml:space="preserve">${xe(o.v)}</t></is></c>`;}).join('')}</row>`;}).join('');
      const cols=Object.keys(sh.cols).map(Number).sort((a,b)=>a-b).map(c=>`<col min="${c+1}" max="${c+1}" width="${sh.cols[c]}" customWidth="1"/>`).join('');
      const fz=sh.freeze?`<pane${sh.freeze[1]?` xSplit="${sh.freeze[1]}"`:''} ySplit="${sh.freeze[0]}" topLeftCell="${ref(sh.freeze[0],sh.freeze[1])}" activePane="${sh.freeze[1]?'bottomRight':'bottomLeft'}" state="frozen"/>`:'';
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><sheetViews><sheetView showGridLines="0" workbookViewId="0">${fz}</sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/>${cols?`<cols>${cols}</cols>`:''}<sheetData>${data}</sheetData>${sh.merges.length?`<mergeCells count="${sh.merges.length}">${sh.merges.map(m=>`<mergeCell ref="${m}"/>`).join('')}</mergeCells>`:''}<printOptions horizontalCentered="1"/><pageMargins left="0.3" right="0.3" top="0.4" bottom="0.4" header="0.2" footer="0.2"/><pageSetup paperSize="9" orientation="${sh.landscape?'landscape':'portrait'}" fitToWidth="1" fitToHeight="0"/></worksheet>`;
    }
    function build(){
      const files=[];
      files.push(['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`]);

const fullDmy=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';

function calc(){
  const orders=D.orders.filter(inMonth), valid=orders.filter(o=>o.status!=='Hoàn/Hủy');
  const revenue=sum(valid,'amount'), done=sum(valid.filter(o=>o.status==='Thành công'),'amount');
  const exps=D.expenses.filter(inMonth), adsM=(D.ads||[]).filter(inMonth), adsSpend=sum(adsM,'spend'), expTotal=sum(exps,'amount')+adsSpend;
  const byCat={}; exps.forEach(e=>{const c=e.category||'Khác';byCat[c]=(byCat[c]||0)+(+e.amount||0)}); if(adsSpend) byCat['Quảng cáo Facebook (tự động)']=adsSpend;
  const views=D.views.filter(inMonth).concat(D.posts.filter(inMonth).map(p=>({...p,auto:true}))), viewTotal=sum(views,'views');
  const people=D.staff.filter(s=>isActive(s)||valid.some(o=>o.staffId===s.id)).map(s=>{const my=valid.filter(o=>o.staffId===s.id), rev=sum(my,'amount'), vids=views.filter(v=>v.staffId===s.id);
    const all=orders.filter(o=>o.staffId===s.id);
    return {s,orders:my.length,allOrders:all.length,cancelled:all.length-my.length,rev,videos:vids.length,views:sum(vids,'views'),...payFor(s,rev)}});
  const payroll=people.reduce((t,p)=>t+p.pay,0);
  return {adsM,adsSpend,orders,valid,revenue,done,exps,expTotal,byCat,views,viewTotal,people,payroll,profit:revenue-expTotal-payroll,cancelled:orders.length-valid.length};
}

function niceMax(m){if(m<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(m)));for(const s of [1,2,2.5,5,10])if(s*p>=m)return s*p;return 10*p;}

  const W=640,H=190,L=46,B=22,T=8,n=vals.length,max=niceMax(Math.max(...vals,0)),cw=(W-L-6)/n;
  let g='';
  [0,.5,1].forEach(f=>{const y=T+(H-T-B)*(1-f);g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${short(max*f)}</text>`});
  vals.forEach((v,i)=>{const h=(H-T-B)*(v/max),x=L+i*cw+cw*.18;
    if(v>0)g+=`<rect x="${x.toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${(cw*.64).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${color}"><title>Ngày ${i+1}: ${fmt(v)}</title></rect>`;
    if(i===0||(i+1)%5===0)g+=`<text x="${(L+i*cw+cw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${i+1}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biểu đồ theo ngày">${g}</svg>`;
}

  const people=D.staff.filter(s=>isActive(s)&&s.role!=='Quản lý');

    const done=tk.filter(x=>x.status==='Xong'),ontime=done.filter(x=>!x.due||doneDay(x)<=x.due).length,od=tk.filter(x=>x.status!=='Xong'&&x.due&&x.due<t).length;

  <div class="small muted" style="margin-top:6px">Đổi kỳ (tháng, tuần, khoảng ngày) ở ô chọn kỳ phía trên. Bấm "Theo nhân sự" để xem chi tiết từng ngày của một người.</div>`;

function vKpi(){
  const c=calc(), people=isAdmin()?c.people:c.people.filter(p=>p.s.id===ME.id);
  if(!people.length) return emptyBox('Chưa có nhân viên','Thêm nhân viên và đặt chỉ tiêu tháng để xem KPI.',addBtn('staff'));
  const item=(lab,v,t,fmt,cls)=>{const p=pct(v,t);return `<div><div class="k">${lab}</div><div class="n">${fmt(v)} <span class="muted small">/ ${t?fmt(t):'chưa đặt'}</span></div>
    <div class="bar ${p>=100?'done':cls}"><span style="width:${Math.min(p||0,100)}%"></span></div><div class="small ${p>=100?'':'muted'}" style="${p>=100?'color:var(--good)':''}">${p===null?'—':p+'%'}</div></div>`};
  return `<div class="grid">${people.map(p=>{const s=p.s, ps=[pct(p.orders,+s.kpiOrders),pct(p.rev,+s.kpiRevenue),pct(p.videos,+s.kpiVideos),pct(p.views,+s.kpiViews)].filter(x=>x!==null);

/* ---------- Lương ---------- */
const HR=()=>Object.assign({workStart:'08:30',workEnd:'17:30',breakMin:60,graceMin:0,otRate:0,stdDays:26,payByAttendance:false,careDays:30,offDays:'sun',gpsRequired:false,officeLat:'',officeLng:'',radius:200,reportDeadline:'17:30'},FLAGS.hr||{});
const LOCKED=()=>(FLAGS.locked||[]).includes(S.month);
const PAID_LEAVE=['Phép năm','Nghỉ ốm'], ABSENCE_TYPES=['Phép năm','Nghỉ ốm','Việc riêng (không lương)'];
const toMin=t=>{const m=String(t||'').match(/^(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null;};
function isOffDay(ds){const d=new Date(ds+'T00:00:00').getDay(), o=HR().offDays; return (o==='sun'&&d===0)||(o==='satsun'&&(d===0||d===6));}
const approvedOn=(sid,ds,types)=>D.leaves.filter(l=>l.staffId===sid&&l.status==='Đã duyệt'&&l.from<=ds&&(l.to||l.from)>=ds&&(!types||types.includes(l.type)));
function onLeave(sid,ds){return approvedOn(sid,ds,ABSENCE_TYPES)[0]||null;}
function shiftOf(sid){
  const s=D.staff.find(x=>x.id===sid), sh=s&&s.shiftId&&(D.shifts||[]).find(x=>x.id===s.shiftId), h=HR();
  return sh?{name:sh.name,start:sh.start,end:sh.end,breakMin:+sh.breakMin||0,graceMin:+sh.graceMin||0}:{name:'Ca chung',start:h.workStart,end:h.workEnd,breakMin:+h.breakMin||0,graceMin:+h.graceMin||0};
}
/* Tính công 1 ngày: trạng thái, phút muộn, phút về sớm, giờ làm, số công, giờ tăng ca */
function dayCalc(sid,ds){
  const t=todayStr(), sh=shiftOf(sid), row=D.attendance.find(x=>x.staffId===sid&&x.date===ds);
  const excuse=approvedOn(sid,ds,['Đi muộn / về sớm']).length>0, trip=approvedOn(sid,ds,['Công tác'])[0];
  const ot=sum(approvedOn(sid,ds,['Tăng ca']).filter(l=>l.from===ds),'hours');
  const S0=toMin(sh.start), E0=toMin(sh.end), std=Math.max(60,(E0-S0)-sh.breakMin);
  const base={ot,shift:sh};
  if(row&&row.checkIn){
    const i=toMin(row.checkIn), o=toMin(row.checkOut);
    const late=excuse?0:Math.max(0,i-S0-sh.graceMin), early=(excuse||o==null)?0:Math.max(0,E0-o);
    let worked=null,cong=1;
    if(o!=null&&o>i){const a=Math.max(i,S0),b=Math.min(o,E0);worked=Math.max(0,b-a)-((a<720+30&&b>720+30)?sh.breakMin:0);if(excuse)worked=std;cong=worked>=std*0.9?1:worked>=std*0.45?0.5:0;}
    return {...base,k:late>0?'late':'ok',a:row,late,early,worked,cong,missingOut:o==null&&ds<t,note:row.note};
  }
  if(trip) return {...base,k:'ok',a:{checkIn:'',checkOut:''},cong:1,late:0,early:0,note:'Công tác'};
  if(row&&row.mark==='work') return {...base,k:'ok',a:{checkIn:'',checkOut:'',source:row.source},cong:1,late:0,early:0,note:row.note};
  if(row&&row.mark==='off') return {...base,k:'off',cong:0,note:row.note};
  const l=onLeave(sid,ds); if(l) return {...base,k:'leave',l,cong:0,paid:PAID_LEAVE.includes(l.type)};
  if(ds>t) return {...base,k:'future',cong:0};
  const sf=D.staff.find(x=>x.id===sid), start=sf&&(sf.startDate||String(sf.createdAt||'').slice(0,10));
  if(start&&ds<start) return {...base,k:'future',cong:0};
  if(isOffDay(ds)) return {...base,k:'off',cong:0};
  return {...base,k:ds===t?'notyet':'absent',cong:0};
}
const dayStatus=dayCalc;
function monthDaysList(){const [y,m]=S.month.split('-').map(Number), n=new Date(y,m,0).getDate();return Array.from({length:n},(_,i)=>S.month+'-'+pad(i+1));}
function monthSum(sid){
  const st=monthDaysList().map(ds=>dayCalc(sid,ds)), c=k=>st.filter(x=>x.k===k).length;
  return {st,cong:Math.round(st.reduce((t,x)=>t+(x.cong||0),0)*10)/10,lateN:c('late'),lateMin:st.reduce((t,x)=>t+(x.late||0),0),
    earlyMin:st.reduce((t,x)=>t+(x.early||0),0),ot:Math.round(st.reduce((t,x)=>t+(+x.ot||0),0)*10)/10,
    leave:c('leave'),paidLeave:st.filter(x=>x.k==='leave'&&x.paid).length,absent:c('absent'),missingOut:st.filter(x=>x.missingOut).length};
}

function customers(){
  const map={};
  D.orders.filter(o=>o.status!=='Hoàn/Hủy'&&normPhone(o.phone)).forEach(o=>{
    const k=normPhone(o.phone), c=map[k]||(map[k]={phone:k,name:'',orders:0,total:0,last:'',first:'9',product:'',staffId:''});
    c.orders++; c.total+=+o.amount||0;
    if(String(o.date)>=c.last){c.last=String(o.date);c.name=o.customer||c.name;c.product=o.product||c.product;c.staffId=o.staffId||c.staffId;}
    if(String(o.date)<c.first)c.first=String(o.date);
  });
  const cares={}; D.care.forEach(x=>{const k=normPhone(x.phone);(cares[k]=cares[k]||[]).push(x);});
  const t=todayStr(), cd=+HR().careDays||30;
  return Object.values(map).map(c=>{
    const cs=(cares[c.phone]||[]).sort((a,b)=>a.date<b.date?1:-1), lastCare=cs[0];
    const due=new Date(new Date(c.last+'T00:00:00').getTime()+cd*86400000); const dueStr=due.getFullYear()+'-'+pad(due.getMonth()+1)+'-'+pad(due.getDate());
    const appt=lastCare&&lastCare.nextDate&&lastCare.date>=c.last?lastCare.nextDate:'';
    const caredAfter=lastCare&&lastCare.date>=c.last;
    const needAt=appt||(caredAfter?'':dueStr);
    return {...c,cares:cs,lastCare,dueStr,needAt,need:!!needAt&&needAt<=t};
  });
}

  const d=new Date(); const wd=(d.getDay()+6)%7; const mon=new Date(d.getTime()-wd*86400000); const wk=mon.getFullYear()+'-'+pad(mon.getMonth()+1)+'-'+pad(mon.getDate());
  const inP=o=>per==='day'?o.date===t:per==='week'?(String(o.date)>=wk&&String(o.date)<=t):inMonth(o);
  const rows=D.staff.filter(s=>isActive(s)||D.orders.some(o=>o.staffId===s.id&&inP(o))).map(s=>{const all=D.orders.filter(o=>o.staffId===s.id&&inP(o)), ok=all.filter(o=>o.status!=='Hoàn/Hủy');
    return {s,rev:sum(ok,'amount'),n:ok.length,all:all.length,bad:all.length-ok.length};}).filter(r=>r.all>0).sort((a,b)=>b.rev-a.rev);
  const top=rows[0]?rows[0].rev:0;
  return `<div class="toolbar"><div class="seg">${[['day','Hôm nay'],['week','Tuần này'],['month','Tháng đang xem']].map(([k,l])=>`<button class="${per===k?'on':''}" data-flt-btn="ranking" data-k="per" data-v="${k}">${l}</button>`).join('')}</div></div>
  ${rows.length?`<div class="list">${rows.map((r,i)=>`<div class="panel rank"><div class="pos ${i<3?'top':''}">${i+1}</div>
    <div class="rk-main"><div class="rk-h"><b>${esc(r.s.name)}</b>${r.s.id===ME.id?' <span class="pill acc">Bạn</span>':''}<span class="spacer"></span><b>${vnd(r.rev)}</b></div>
    <div class="bar"><span style="width:${top?Math.round(r.rev/top*100):0}%"></span></div>
    <div class="small muted">${nf(r.n)} đơn thành công · ${nf(r.bad)} hoàn/hủy (${r.all?Math.round(r.bad/r.all*100):0}%) · TB ${short(r.n?r.rev/r.n:0)}/đơn</div></div></div>`).join('')}</div>`
  :emptyBox('Chưa có đơn trong khoảng này','Đơn gán cho nhân viên (từ Pancake hoặc nhập tay) sẽ được xếp hạng ở đây.','')}`;
}

function reqWhen(l){
  const d=dmy(l.from)+(l.to&&l.to!==l.from?' – '+dmy(l.to):'');
  if(l.type==='Tăng ca') return d+' · '+(+l.hours||0)+' giờ';
  if(l.type==='Quên chấm công'||l.type==='Đi muộn / về sớm') return d+(l.timeIn?' · vào '+esc(l.timeIn):'')+(l.timeOut?' · ra '+esc(l.timeOut):'');
  if(l.type==='Nghỉ việc') return 'Làm đến hết '+d;
  return d+(l.to&&l.to!==l.from?' ('+(Math.round((new Date(l.to)-new Date(l.from))/864e5)+1)+' ngày)':'');
}

function clockBox(){
  const t=todayStr(), a=D.attendance.find(x=>x.staffId===ME.id&&x.date===t), sh=shiftOf(ME.id), h=HR();
  const gps=isRemote()?'<div class="small muted" style="margin-top:6px">Bạn làm việc bên ngoài: mỗi lần chấm cần chụp 1 ảnh nơi làm việc, hệ thống ghi kèm vị trí (bật định vị).</div>':h.gpsRequired?'<div class="small muted" style="margin-top:6px">Cần bật định vị và ở gần công ty.</div>':'';

  const late=Math.max(0,toMin(a.checkIn)-toMin(sh.start)-(+sh.graceMin||0));
  const src=a.source==='Máy chấm công'?' <span class="small muted">(máy chấm công)</span>':'';

function getLoc(){return new Promise((res,rej)=>{
  if(!navigator.geolocation) return rej(new Error('Thiết bị không hỗ trợ định vị.'));
  navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)}),
    e=>rej(new Error(e.code===1?'Bạn chưa cho phép định vị. Vào cài đặt trình duyệt, cho phép vị trí cho trang này rồi thử lại.':'Không lấy được vị trí. Ra chỗ thoáng hoặc bật GPS rồi thử lại.')),
    {enableHighAccuracy:true,timeout:12000,maximumAge:0});});}
const photoLink=id=>id?` <button type="button" class="linkbtn small" data-act="photo" data-id="${esc(id)}">📷 ảnh</button>`:'';
const isRemote=()=>((D.staff.find(s=>s.id===ME.id)||{}).remote==='Có');
const mapLink=l=>l?` <a class="small" href="https://www.google.com/maps?q=${encodeURIComponent(String(l).split(',').slice(0,2).join(','))}" target="_blank" rel="noopener">📍 vị trí</a>`:'';
/* Chụp ảnh bằng camera điện thoại, đóng dấu giờ + tên, nén nhỏ */
function takePhoto(){return new Promise((res,rej)=>{
  let inp=document.getElementById('cam-in');
  if(!inp){inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.setAttribute('capture','environment');inp.id='cam-in';inp.hidden=true;document.body.appendChild(inp);}
  inp.value='';
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return rej(new Error('Chưa chụp ảnh.'));
    const img=new Image(),u=URL.createObjectURL(f);
    img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height)),w=Math.round(img.width*k),h=Math.round(img.height*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(img,0,0,w,h);
      const d=new Date(),txt=`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())} · ${ME.name}`;
      const fs=Math.max(16,Math.round(w/32));g.font=`600 ${fs}px sans-serif`;g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,h-fs*1.9,w,fs*1.9);
      g.fillStyle='#fff';g.fillText(txt,fs*.6,h-fs*.6);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.72));};
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Không đọc được ảnh, chụp lại giúp.'));};img.src=u;};

/* ---------- Nhập file máy chấm công ---------- */
let IMP=null;
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('Không tải được bộ đọc Excel. Kiểm tra mạng rồi thử lại.'));document.head.appendChild(sc);});}
const p2=n=>String(n).padStart(2,'0');
function serialDT(n){const ms=Math.round((n-25569)*86400000), d=new Date(ms);return {date:n>=1?d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate()):null,time:(n%1)>0?p2(d.getUTCHours())+':'+p2(d.getUTCMinutes()):null};}
function parseDT(v){
  if(v==null||v==='') return {date:null,time:null};
  if(typeof v==='number'){ if(v>=0&&v<1) return serialDT(v); if(v>20000&&v<80000) return serialDT(v); return {date:null,time:null}; }
  const s=String(v).trim(); let date=null,time=null,m;
  if((m=s.match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) date=m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
  else if((m=s.match(/(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;date=y+'-'+p2(m[2])+'-'+p2(m[1]);}
  if((m=s.match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM|SA|CH)?/i))){let h=+m[1];const ap=(m[3]||'').toUpperCase();if((ap==='PM'||ap==='CH')&&h<12)h+=12;if((ap==='AM'||ap==='SA')&&h===12)h=0;time=p2(h)+':'+m[2];}
  if(date&&!/^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(date)) date=null;
  return {date,time};
}
function guessCols(rows){
  const n=Math.max(...rows.slice(0,50).map(r=>r.length)), kinds=[];
  for(let c=0;c<n;c++){
    const vals=rows.slice(0,50).map(r=>r[c]).filter(v=>v!=null&&v!=='');
    let dt=0,d=0,t=0,id=0,txt=0;
    vals.forEach(v=>{const x=parseDT(v);if(x.date&&x.time)dt++;else if(x.date)d++;else if(x.time)t++;
      const sv=String(v).trim();if(/^[A-Za-z]{0,4}\d{1,9}$/.test(sv)&&!x.date&&!x.time)id++;else if(/[A-Za-zÀ-ỹ]{2,}/.test(sv)&&!x.date&&!x.time)txt++;});
    const k=vals.length||1;kinds.push({dt:dt/k,d:d/k,t:t/k,id:id/k,txt:txt/k});
  }
  const best=key=>{let bi=-1,bv=0.5;kinds.forEach((k,i)=>{if(k[key]>bv){bv=k[key];bi=i;}});return bi;};
  return {n,dt:best('dt'),date:best('d'),time:best('t'),id:best('id'),name:best('txt')};
}
async function readAttFile(file){
  await loadXLSX();
  const buf=await file.arrayBuffer(); let rows;
  if(/\.(txt|dat)$/i.test(file.name)){
    const txt=new TextDecoder('utf-8').decode(buf);
    rows=txt.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.includes('\t')?l.split('\t').map(x=>x.trim()):l.trim().split(/\s{2,}|,|;/).map(x=>x.trim()));
    rows=rows.map(r=>{const o=[];r.forEach(x=>{const m=x.match(/^(\d{4}-\d{2}-\d{2})\s+(\d{1,2}:\d{2}(?::\d{2})?)$/);o.push(m?m[1]+' '+m[2]:x);});return o;});
  } else {
    const wb=XLSX.read(buf,{type:'array',cellDates:false});
    const sheets=wb.SheetNames.map(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}));
    if(sheets.some(sh=>sh.some(r=>/m[ãa] nh[âa]n vi[êe]n\s*:/i.test(String(r[0]||''))))){ readBlocks(file.name,sheets); return; }
    rows=sheets[0];
  }
  rows=rows.filter(r=>r.some(v=>v!==''&&v!=null));
  let hdr=-1; for(let i=0;i<Math.min(15,rows.length);i++){const line=rows[i].join(' ').toLowerCase();if(/(mã|ma nv|id|ac-no|tên|name|thời gian|time|ngày|date|giờ)/.test(line)&&!rows[i].some(v=>parseDT(v).date)){hdr=i;break;}}
  const header=hdr>=0?rows[hdr].map(String):null, data=rows.slice(hdr+1);
  if(!data.length) throw new Error('File không có dòng dữ liệu nào.');
  const g=guessCols(data);
  const map=Object.assign({},(SETTINGS&&SETTINGS.attMap)||{});
  IMP={file:file.name,header,data,cols:{id:g.id,name:g.name,dt:g.dt,date:g.dt>=0?-1:g.date,time:g.dt>=0?-1:g.time},n:g.n,map};
  autoMap();
}

/* Mẫu "Bảng chi tiết chấm công" của Wise Eye: mỗi nhân viên một khối, mỗi ngày một dòng Vào/Ra */
function readBlocks(fname,sheets){
  let dm=0,md=0;
  sheets.forEach(sh=>sh.forEach(r=>{const m=String(r[0]||'').match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);if(m){if(+m[1]>12)dm++;if(+m[2]>12)md++;}}));
  const dayFirst=dm>md;
  const toDate=v=>{
    if(typeof v==='number'&&v>20000) return serialDT(v).date;
    const m=String(v||'').trim().match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/); if(!m) return null;
    const d=dayFirst?+m[1]:+m[2], mo=dayFirst?+m[2]:+m[1]; if(mo<1||mo>12||d<1||d>31) return null;
    return m[3]+'-'+p2(mo)+'-'+p2(d);
  };
  const recs=[];
  sheets.forEach(sh=>{let cur=null;
    sh.forEach(r=>{
      const c0=String(r[0]||'');
      const em=c0.match(/m[ãa] nh[âa]n vi[êe]n\s*:\s*([^\s]+)/i);
      if(em){const nm=c0.match(/t[êe]n nh[âa]n vi[êe]n\s*:\s*(.*?)\s*(ph[òo]ng ban|$)/i);cur={mid:em[1],name:nm?nm[1].trim():''};return;}
      if(!cur) return;
      const date=toDate(r[0]); if(!date) return;
      const times=[], notes=[];
      for(let c=2;c<Math.min(r.length,10);c++){const v=r[c]; if(v===''||v==null) continue;
        if(typeof v==='number'&&v>0&&v<1){times.push(serialDT(v).time);continue;}
        const sv=String(v).trim(); const tm=sv.match(/^(\d{1,2}):(\d{2})/);
        if(tm){times.push(p2(tm[1])+':'+tm[2]);continue;}
        if(/[A-Za-zÀ-ỹ]/.test(sv)) notes.push(sv);}
      recs.push({mid:cur.mid,name:cur.name,date,times:times.sort(),note:notes.join(', ')});
    });
  });
  if(!recs.length) throw new Error('Không tìm thấy dòng ngày nào trong file.');
  const noteMap={}; recs.forEach(x=>{if(x.note&&!x.times.length){const k=x.note.toLowerCase().trim();if(!(k in noteMap))noteMap[k]=/ngh[iỉ]|l[eễ]|ph[eé]p|off/i.test(k)?'off':'work';}});
  IMP={mode:'block',file:fname,recs,noteMap,dayFirst,map:Object.assign({},(SETTINGS&&SETTINGS.attMap)||{})};
  autoMap();
}

function impIds(){
  if(IMP&&IMP.mode==='block'){const seen={};IMP.recs.forEach(x=>{const o=seen[x.mid]||(seen[x.mid]={id:x.mid,name:x.name,n:0});if(x.times.length)o.n++;if(!o.name&&x.name)o.name=x.name;});return Object.values(seen).sort((a,b)=>String(a.id).localeCompare(String(b.id),'vi',{numeric:true}));}
  if(!IMP||IMP.cols.id<0) return [];
  const seen={}; IMP.data.forEach(r=>{const id=String(r[IMP.cols.id]??'').trim(); if(!id) return; if(!seen[id]) seen[id]={id,name:IMP.cols.name>=0?String(r[IMP.cols.name]||'').trim():'',n:0}; seen[id].n++;});
  return Object.values(seen).sort((a,b)=>String(a.id).localeCompare(String(b.id),'vi',{numeric:true}));
}
const normName=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').trim();
function autoMap(){impIds().forEach(x=>{if(IMP.map[x.id]||!x.name) return;const nm=normName(x.name);const s=D.staff.find(s=>{const sn=normName(s.name);return sn===nm||sn.endsWith(' '+nm)||nm.endsWith(' '+sn);});if(s) IMP.map[x.id]=s.id;});}
function impRecords(){
  if(IMP.mode==='block'){const recs=[];let unmapped=0;
    IMP.recs.forEach(x=>{const sid=IMP.map[x.mid]; if(!sid){if(x.times.length||x.note)unmapped++;return;}
      if(x.times.length){const ci=x.times[0], co=x.times[x.times.length-1];recs.push({staffId:sid,date:x.date,checkIn:ci,checkOut:co>ci?co:'',note:x.note||''});}
      else if(x.note){const k=x.note.toLowerCase().trim(), how=IMP.noteMap[k]; if(how&&how!=='skip') recs.push({staffId:sid,date:x.date,checkIn:'',checkOut:'',note:x.note,mark:how});}});
    return {recs,bad:0,unmapped,days:recs.length};}
  const c=IMP.cols, agg={}; let bad=0;
  IMP.data.forEach(r=>{
    const mid=String(r[c.id]??'').trim(); if(!mid) return;
    let dt=c.dt>=0?parseDT(r[c.dt]):{date:parseDT(r[c.date]).date,time:parseDT(r[c.time]).time};
    if(!dt.date||!dt.time){bad++;return;}
    const k=mid+'|'+dt.date, o=agg[k]||(agg[k]={mid,date:dt.date,min:dt.time,max:dt.time});
    if(dt.time<o.min)o.min=dt.time; if(dt.time>o.max)o.max=dt.time;
  });
  const recs=[]; let unmapped=0;
  Object.values(agg).forEach(o=>{const sid=IMP.map[o.mid]; if(!sid){unmapped++;return;} recs.push({staffId:sid,date:o.date,checkIn:o.min,checkOut:o.max>o.min?o.max:''});});
  return {recs,bad,unmapped,days:Object.keys(agg).length};
}

/* ====== CẤU HÌNH: dán link Ứng dụng web Apps Script (đuôi /exec) vào giữa hai dấu nháy ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyfHiHd55jg96KVMfGLK3kLgOmuRQ9g6vg8fH9nO_4iR_JLrvtqRmm6IPPChzct5JnO6g/exec';
/* ========================================================================================== */
async function run(fn,...args){
  if(!/^https:\/\/script\.google\.com\//.test(API_URL)) throw new Error('Chưa cấu hình API_URL trong file index.html.');
  let r;
  try{ r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})}); }
  catch(e){ throw new Error('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.'); }
  let j; try{ j=await r.json(); }catch(e){ throw new Error('Máy chủ trả về dữ liệu lạ. Kiểm tra lại API_URL và quyền "Bất kỳ ai".'); }
  if(!j.ok) throw new Error(j.error); return j.result;
}
const msg=e=>String((e&&e.message)||e||'Có lỗi xảy ra.').replace(/^Error:\s*/,'').replace(/^Exception:\s*/,'');

}

    if(ONE_DAY.includes(obj.type)||!obj.to) obj.to=obj.from;

    if(obj.type==='Quên chấm công'&&!obj.timeIn&&!obj.timeOut){formErr('Nhập giờ vào hoặc giờ ra thực tế.');return;}
    if(obj.type==='Nghỉ việc'&&!obj.reason){formErr('Vui lòng ghi lý do nghỉ việc.');return;}

let tt=null;

function shiftMonth(d){
  if(S.per&&S.per!=='month'){const p=PER(),n=perDays(p);
    if(n===1){S.per='day';S.from=addDays(p.from,d);}else{S.per='range';S.from=addDays(p.from,d*n);S.to=addDays(p.to,d*n);}
    S.month=PER().to.slice(0,7);render();return;}
  let [y,m]=S.month.split('-').map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}S.month=y+'-'+pad(m);render();}
document.addEventListener('click',async e=>{
  if(e.target.closest('[data-stop]'))return;
  const fb=e.target.closest('[data-flt-btn]');

  if(nv){S.view=nv.dataset.view;try{localStorage.setItem('md-view',S.view)}catch(_){}render();window.scrollTo(0,0);return;}
  const a=e.target.closest('[data-act]'); if(!a)return;
  const act=a.dataset.act;
  if(act==='mprev')shiftMonth(-1); else if(act==='mnext')shiftMonth(1);
  else if(act==='logout')logout();
  else if(act==='tkdone'){const x=D.tasks.find(t=>t.id===a.dataset.id);if(!x)return;openForm('tasks',x.id);setTimeout(()=>{const st=document.getElementById('f_status');if(st)st.value='Xong';document.getElementById('form-title').textContent='Báo hoàn thành: '+x.title;const l=document.getElementById('f_link')||document.getElementById('f_report');l&&l.focus();},40);}
  else if(act==='tkok'){const x=D.tasks.find(t=>t.id===a.dataset.id);if(x){a.disabled=true;await saveQuiet('tasks',x.id,{...x,review:'Đã duyệt'},'Đã duyệt kết quả');}}
  else if(act==='tkredo'){const x=D.tasks.find(t=>t.id===a.dataset.id);if(!x)return;const why=prompt('Cần làm lại điểm nào? (nhân viên sẽ thấy dòng này)',x.reviewNote||'');if(why===null)return;
    a.disabled=true;await saveQuiet('tasks',x.id,{...x,status:'Đang làm',review:'Làm lại',reviewNote:why.trim(),doneAt:''},'Đã trả việc về để làm lại');}

function donut(parts){const tot=parts.reduce((t,p)=>t+p.v,0)||1,R=60,C=2*Math.PI*R;let off=0;
  const segs=parts.filter(p=>p.v>0).map(p=>{const len=p.v/tot*C,s=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${p.c}" stroke-width="26" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 80 80)"><title>${esc(p.l)}: ${nf(p.v)}</title></circle>`;off+=len;return s;}).join('');
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 160 160" width="170" role="img" aria-label="Tỷ trọng">${segs||`<circle r="${R}" cx="80" cy="80" fill="none" stroke="var(--sunk)" stroke-width="26"/>`}<text x="80" y="78" text-anchor="middle" style="font-size:24px;font-weight:800;fill:var(--ink)">${nf(parts.reduce((t,p)=>t+p.v,0))}</text><text x="80" y="98" text-anchor="middle" style="font-size:11px;fill:var(--muted)">video</text></svg>

function lineChart(series,n){const W=640,H=200,L=34,B=22,T=10,mx=niceMax(Math.max(1,...series.flatMap(s=>s.vals))),cw=(W-L-8)/Math.max(1,n-1);
  let g='';[0,.5,1].forEach(f=>{const y=T+(H-T-B)*(1-f);g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${short(mx*f)}</text>`;});
  for(let i=0;i<n;i++)if(i===0||(i+1)%5===0)g+=`<text x="${(L+i*cw).toFixed(1)}" y="${H-6}" text-anchor="middle">${i+1}</text>`;
  series.forEach(s=>{const pts=s.vals.map((v,i)=>`${(L+i*cw).toFixed(1)},${(T+(H-T-B)*(1-v/mx)).toFixed(1)}`).join(' ');g+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"><title>${esc(s.name)}</title></polyline>`;});

const adsK=(st,m)=>(D.adskpi||[]).find(k=>k.staffId===st&&k.month===m);
function adsScore(r){const k=adsK(r.staffId,String(r.date).slice(0,7));if(!k)return null;const sp=+r.spend||0,rv=+r.revenue||0,od=+r.orders||0,dt=+r.data||0,ct=+r.newContent||0;
  const part=(v,t)=>t>0?Math.min(v/t,1):0;let s=0;
  s+=40*part(rv,+k.revenueDay);s+=30*part(sp?rv/sp:0,+k.roas);s+=10*(+k.cpa>0&&od?Math.min(+k.cpa/(sp/od),1):0);s+=10*part(dt?od/dt*100:0,+k.closeRate);s+=10*part(ct,+k.contentDay);return Math.round(s);}

    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">${!forBoss&&x.status!=='Xong'?`${x.status!=='Đang làm'?`<button class="btn" data-act="tkst" data-id="${x.id}" data-st="Đang làm">Bắt đầu làm</button>`:''}<button class="btn primary" data-act="tkdone" data-id="${x.id}">Hoàn thành</button>`:''}
      ${forBoss&&x.status==='Xong'&&x.review==='Chờ duyệt'?`<button class="btn primary" data-act="tkok" data-id="${x.id}">✓ Duyệt</button><button class="btn danger" data-act="tkredo" data-id="${x.id}">Yêu cầu làm lại</button>`:''}
      <button class="btn" data-act="edit" data-col="tasks" data-id="${x.id}">${forBoss?'Sửa':x.status==='Xong'?'Xem':'Ghi báo cáo / link'}</button></div></div>`;}
VIEWS.mytasks=function(){
  const all=assignedToMe(),f=tabVal('mtk','open'),t=todayStr();
  const open=all.filter(x=>x.status!=='Xong').sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1),done=all.filter(x=>x.status==='Xong').sort((a,b)=>String(b.updatedAt||'')<String(a.updatedAt||'')?-1:1);
  const od=open.filter(x=>x.due&&x.due<t).length;
  return `<div class="grid tiles">${tile2('Đang chờ làm',nf(open.filter(x=>x.status!=='Đang làm').length),'việc mới được giao')}${tile2('Đang làm',nf(open.filter(x=>x.status==='Đang làm').length),'')}${tile2('Quá hạn',`<span class="${od?'neg':''}">${od}</span>`,'')}${tile2('Đã hoàn thành',nf(done.length),'','money')}</div>
  <div style="margin-top:14px">${tabs('mtk',[['open',`Chưa xong (${open.length})`],['done',`Đã xong (${done.length})`]],'open')}</div>
  <div class="list">${(f==='done'?done:open).map(x=>taskCard(x,false)).join('')||emptyBox(f==='done'?'Chưa có việc hoàn thành':'Không có việc nào đang chờ','Việc quản lý giao cho bạn sẽ hiện ở đây. Làm xong bấm "Hoàn thành" và ghi báo cáo kết quả.','')}</div>`;
};
VIEWS.given=function(){
  const st=(S.f.given||{}).staff||'',f=tabVal('gvt','open'),t=todayStr();
  const all=D.tasks.filter(x=>x.createdBy===ME.id&&x.staffId&&x.staffId!==ME.id&&(!st||x.staffId===st));
  const list=all.filter(x=>f==='all'||(f==='rev'?x.status==='Xong'&&x.review==='Chờ duyệt':f==='done'?x.status==='Xong':x.status!=='Xong')).sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1);
  const ppl=[...new Set(all.map(x=>x.staffId))].map(id=>{const xs=all.filter(x=>x.staffId===id);return {id,n:xs.length,d:xs.filter(x=>x.status==='Xong').length,o:xs.filter(x=>x.status!=='Xong'&&x.due&&x.due<t).length};});
  return `<div class="toolbar">${staffFilter('given')}<span class="spacer"></span>${addBtn('tasks','Giao việc mới')}</div>
  ${ppl.length?`<div class="tablewrap" style="margin-bottom:14px"><table><thead><tr><th>Nhân sự</th><th class="num">Đã giao</th><th class="num">Hoàn thành</th><th class="num">Quá hạn</th><th>Tiến độ</th></tr></thead><tbody>${ppl.map(p=>`<tr><td><b>${esc(staffName(p.id))}</b></td><td class="num">${p.n}</td><td class="num">${p.d}</td><td class="num ${p.o?'neg':''}">${p.o}</td><td style="min-width:140px"><div class="prog good"><span style="width:${p.n?p.d/p.n*100:0}%"></span></div></td></tr>`).join('')}</tbody></table></div>`:''}
  ${tabs('gvt',[['rev',`Chờ duyệt (${all.filter(x=>x.status==='Xong'&&x.review==='Chờ duyệt').length})`],['open','Chưa xong'],['done','Đã xong'],['all','Tất cả']],'open')}
  <div class="list">${list.map(x=>taskCard(x,true)).join('')||emptyBox('Chưa giao việc nào','Bấm "Giao việc mới", chọn người phụ trách, hạn và mô tả. Nhân sự sẽ thấy ngay ở mục "Việc được giao".','')}</div>`;
};

/* ---------- Đề xuất cải tiến ---------- */
VIEWS.ideas=function(){
  const rs=(D.ideas||[]).slice().sort((a,b)=>a.date<b.date?1:-1),c=s=>rs.filter(r=>(r.status||'Mới')===s).length;
  const stp=s=>`<span class="pill ${s==='Áp dụng'?'good':s==='Không áp dụng'?'bad':s==='Đang xem xét'?'warn':'acc'}">${esc(s||'Mới')}</span>`;
  return `<div class="toolbar"><span class="muted">${isAdmin()?'Đề xuất của cả công ty. Bấm vào để phản hồi và đổi trạng thái.':'Góp ý cách làm tốt hơn. Quản lý sẽ xem và phản hồi.'}</span><span class="spacer"></span><button class="btn primary" data-act="add" data-col="ideas">+ Gửi đề xuất</button></div>
  <div class="grid tiles">${IDEA_ST.map(s=>tile2(s,nf(c(s)),'')).join('')}</div>
  <div class="list" style="margin-top:14px">${rs.map(r=>`<div class="panel row" data-act="edit" data-col="ideas" data-id="${r.id}" style="cursor:pointer"><div class="toolbar" style="margin:0"><b>${esc(r.title)}</b><span class="spacer"></span>${stp(r.status)}</div>
    <div class="small muted">${esc(staffName(r.staffId))} · ${fullDmy(r.date)}</div><div style="margin-top:6px;white-space:pre-wrap">${esc(r.content)}</div>
    ${r.reply?`<div class="notice" style="margin-top:8px"><b>Quản lý:</b> ${esc(r.reply)}</div>`:''}</div>`).join('')||emptyBox('Chưa có đề xuất','','')}</div>`;
};

/* ---------- Quản lý nhân sự ---------- */
VIEWS.staff=function(){
  const f=S.f.st||{},q=(f.q||'').toLowerCase(),showOff=!!f.off,all=D.staff;
  const list=all.filter(s=>(showOff||isActive(s))&&(!f.team||(f.team==='_'?!s.team:s.team===f.team))&&(!f.role||s.role===f.role)&&(!q||[s.name,s.username,s.code].some(x=>String(x||'').toLowerCase().includes(q))));
  const teamKey=s=>s.team||'';const groups=[...ALL_TEAMS,''].filter(t=>list.some(s=>teamKey(s)===t)).concat([...new Set(list.map(teamKey))].filter(t=>t&&!ALL_TEAMS.includes(t)));
  const chCount=id=>(D.kenh||[]).filter(c=>c.staffId===id&&c.active!=='Không').length;
  const pp=s=>{const p=permsOf(s);return [['mkt','MKT'],['sales','Doanh thu'],['hr','Chấm công']].filter(([k])=>p[k]).map(([,l])=>`<span class="tag">${l}</span>`).join(' ')||'<span class="small muted">Chỉ của mình</span>';};
  return `<div class="toolbar"><span class="muted">Tài khoản đăng nhập của nhân sự. Cho nghỉ hoặc xóa không làm mất báo cáo cũ.</span><span class="spacer"></span>${addBtn('staff','Thêm nhân sự')}</div>
  <div class="grid tiles">${tile2('Tổng tài khoản',nf(all.length),'')}${tile2('Đang làm việc',nf(all.filter(isActive).length),'','money')}${tile2('Đã nghỉ / khóa',nf(all.filter(s=>!isActive(s)).length),'')}${tile2('Thuộc Marketing',nf(all.filter(s=>isActive(s)&&(s.dept||deptOfTeam(s.team))==='Marketing').length),'')}</div>
  <div class="panel" style="margin:14px 0"><div class="toolbar" style="margin:0"><input type="search" id="st-q" data-fst="q" placeholder="Tìm theo tên, tên đăng nhập, mã NV…" value="${esc(f.q||'')}" style="flex:1;min-width:200px">
    <select id="st-team" data-fst="team" aria-label="Team"><option value="">Tất cả team</option>${ALL_TEAMS.map(t=>`<option ${f.team===t?'selected':''}>${t}</option>`).join('')}<option value="_" ${f.team==='_'?'selected':''}>Chưa xếp team</option></select>
    <select id="st-role" data-fst="role" aria-label="Vai trò"><option value="">Tất cả vai trò</option>${ROLES.map(r=>`<option ${f.role===r?'selected':''}>${r}</option>`).join('')}</select>
    <label class="chk"><input type="checkbox" id="st-off" data-fst="off" ${showOff?'checked':''}> Hiện cả người đã nghỉ</label></div></div>
  ${groups.map(t=>{const ss=list.filter(s=>teamKey(s)===t).sort((a,b)=>String(a.code||'~').localeCompare(String(b.code||'~'))||String(a.name).localeCompare(String(b.name),'vi'));
    return `<div class="panel" style="margin-bottom:12px;padding:0;overflow:hidden"><div class="toolbar" style="margin:0;padding:12px 16px"><b>${t?(deptOfTeam(t)?esc(deptOfTeam(t))+' · ':'')+'Team '+esc(t):'Chưa xếp team'}</b><span class="small muted">${ss.length} người</span></div>
    <div class="tablewrap" style="border:0;border-radius:0"><table><thead><tr><th>Nhân sự</th><th>Tên đăng nhập</th><th>Vai trò</th><th>Phòng ban</th><th>Quyền xem</th><th class="num">Kênh</th><th>Mật khẩu</th><th class="num">Lương cứng</th><th>Trạng thái</th><th></th></tr></thead><tbody>
    ${ss.map(s=>`<tr${isActive(s)?'':' style="opacity:.55"'}><td><b>${esc(s.name)}</b>${s.id===ME.id?' <span class="pill acc">Bạn</span>':''}<div class="small muted">${esc(s.code||'')}${s.remote==='Có'?' · làm ngoài':''}</div></td>
      <td>${s.username?`<code>${esc(s.username)}</code>`:'<span class="small neg">chưa có</span>'}</td><td><span class="pill">${esc(s.role)}</span></td><td>${esc(s.dept||deptOfTeam(s.team)||'—')}</td><td>${pp(s)}</td><td class="num">${chCount(s.id)||'—'}</td>
      <td class="muted"><code>${esc(s.pin)}</code></td><td class="num">${short(s.baseSalary)}</td><td>${isActive(s)?'<span class="pill good">● Đang làm</span>':`<span class="pill bad">Đã nghỉ${s.endDate?' '+dmy(s.endDate):''}</span>`}</td>
      <td style="white-space:nowrap"><button class="btn" data-act="edit" data-col="staff" data-id="${s.id}">Sửa</button>${s.id!==ME.id?` <button class="btn" data-act="stquit" data-id="${s.id}">${isActive(s)?'Cho nghỉ':'Mở lại'}</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`;}).join('')||emptyBox('Không có nhân sự phù hợp bộ lọc','','')}`;
};

/* ---------- thông báo + tìm nhanh ---------- */
function bellItems(){const L=[],t=todayStr(),tm=myTeam();
  if(isAdmin()){const lv=D.leaves.filter(l=>(l.status||'Chờ duyệt')==='Chờ duyệt').length;if(lv)L.push([`${lv} đơn từ chờ duyệt`,'hr']);
    const wl=(D.worklog||[]).filter(w=>(w.approved||'Chờ duyệt')==='Chờ duyệt').length;if(wl)L.push([`${wl} công việc Media chờ duyệt`,'worklog']);
    const id=(D.ideas||[]).filter(i=>(i.status||'Mới')==='Mới').length;if(id)L.push([`${id} đề xuất mới`,'ideas']);
    const rv=D.tasks.filter(x=>x.status==='Xong'&&x.review==='Chờ duyệt'&&x.createdBy===ME.id).length;if(rv)L.push([`${rv} việc đã giao chờ duyệt kết quả`,'given']);}
  const rq=(D.reqs||[]).filter(r=>r.status==='Mới'&&(isAdmin()||reqForMe(r))).length;if(rq)L.push([`${rq} order mới ${isAdmin()?'giữa các team':'gửi đến '+myReqLabel()}`,'reqs']);
  const od=D.tasks.filter(x=>x.status!=='Xong'&&x.due&&x.due<t&&(isAdmin()||x.staffId===ME.id)).length;if(od)L.push([`${od} công việc quá hạn`,isAdmin()?'given':'mytasks']);
  if(!isAdmin()){const nw=assignedToMe().filter(x=>(x.status||'Cần làm')==='Cần làm').length;if(nw)L.push([`${nw} việc mới được giao cho bạn`,'mytasks']);
    const rd=assignedToMe().filter(x=>x.status!=='Xong'&&x.review==='Làm lại').length;if(rd)L.push([`${rd} việc quản lý yêu cầu làm lại`,'mytasks']);
    if(myReportDue())L.push([`Bạn chưa nộp báo cáo hôm nay (chốt ${HR().reportDeadline||'17:30'})`,'reports']);}
  const fx=(D.worklog||[]).filter(w=>w.staffId===ME.id&&w.approved==='Cần sửa').length;if(fx)L.push([`${fx} công việc cần sửa lại`,'worklog']);
  const myL=D.leaves.filter(l=>l.staffId===ME.id&&l.status&&l.status!=='Chờ duyệt'&&String(l.updatedAt||'')>=addDays(t,-3)).length;if(myL&&!isAdmin())L.push([`${myL} đơn của bạn vừa được xử lý`,'hr']);
  return L.filter(x=>navAllowed(x[1]));}
function updateBell(){const L=bellItems(),b=document.getElementById('bell-n');if(!b)return;b.hidden=!L.length;b.textContent=L.length;
  const pop=document.getElementById('bell-pop');if(!pop.hidden)pop.innerHTML=bellHtml(L);}
const bellHtml=L=>L.length?L.map(([t,v])=>`<button data-view="${v}">${esc(t)}</button>`).join(''):'<div class="small muted" style="padding:10px">Không có thông báo mới.</div>';
document.getElementById('qs').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase(),box=document.getElementById('qs-res');if(!q){box.hidden=true;return;}
  const nav=NAV.filter(x=>x.v&&navAllowed(x.v)&&x.l.toLowerCase().includes(q)).slice(0,6).map(x=>`<button data-view="${x.v}">📄 ${esc(x.l)}</button>`);
  const st=isAdmin()?D.staff.filter(s=>[s.name,s.username,s.code].some(v=>String(v||'').toLowerCase().includes(q))).slice(0,6).map(s=>`<button data-act="edit" data-col="staff" data-id="${s.id}">👤 ${esc(s.name)}</button>`):[];
  const ch=(D.kenh||[]).filter(c=>String(c.name).toLowerCase().includes(q)).slice(0,6).map(c=>`<button data-view="ch_${c.group}">📺 ${esc(c.name)} <span class="small muted">${esc(grpOf(c.group).s)}</span></button>`);
  const tk=D.tasks.filter(x=>String(x.title).toLowerCase().includes(q)).slice(0,4).map(x=>`<button data-act="edit" data-col="tasks" data-id="${x.id}">✅ ${esc(x.title)}</button>`);
  const all=[...nav,...st,...ch,...tk];box.innerHTML=all.join('')||'<div class="small muted" style="padding:10px">Không tìm thấy.</div>';box.hidden=false;});

/* ---------- sự kiện ---------- */
const saveQuiet=async(col,id,obj,ok)=>{try{apply(await run('save',PIN,col,id,obj));if(ok)toast(ok);}catch(err){toast(msg(err));}};
document.addEventListener('click',async e=>{
  const pop=document.getElementById('bell-pop'),qs=document.getElementById('qs-res');
  if(!e.target.closest('.bellwrap'))pop.hidden=true;if(!e.target.closest('.qsearch'))qs.hidden=true;
  if(e.target.closest('#qs-res [data-view],#qs-res [data-act],#bell-pop [data-view]')){pop.hidden=true;qs.hidden=true;document.getElementById('qs').value='';}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(act==='bell'){pop.innerHTML=bellHtml(bellItems());pop.hidden=!pop.hidden;}
  else if(act==='tab'){S.f[a.dataset.k]=a.dataset.v;render();}
  else if(act==='chopen'){S.f.chopen=S.f.chopen===a.dataset.id?'':a.dataset.id;render();}
  else if(act==='chrep'){const c=chanOf(a.dataset.ch),p=PER(),d=p.from===p.to?p.from:todayStr(),r=(D.chrep||[]).find(x=>x.channelId===a.dataset.ch&&x.date===d);
    r?openForm('chrep',r.id):openForm('chrep',null,{channelId:a.dataset.ch,date:d,staffId:c&&c.staffId});}
  else if(act==='add'&&a.dataset.col==='kenh'&&a.dataset.grp){e.stopImmediatePropagation();openForm('kenh',null,{group:a.dataset.grp});}
  else if(act==='mktplan'){const x=(D.mktplan||[]).find(p=>p.month===S.month);x?openForm('mktplan',x.id):openForm('mktplan',null,{month:S.month});}
  else if(act==='cladd'){const st=document.getElementById('cl-st').value,nm=document.getElementById('cl-name').value.trim(),tg=document.getElementById('cl-tag').value;
    if(!nm){toast('Nhập tên đầu việc');return;}S.f.cladd={st};a.disabled=true;const ord=(D.cltpl||[]).filter(i=>i.staffId===st).length+1;await saveQuiet('cltpl',null,{staffId:st,name:nm,tag:tg,order:ord},'Đã thêm đầu việc');}
  else if(act==='cldel'){if(a.dataset.sure!=='1'){a.dataset.sure='1';a.textContent='Xóa?';return;}try{apply(await run('remove',PIN,'cltpl',a.dataset.id));toast('Đã xóa đầu việc');}catch(err){toast(msg(err));}}
  else if(act==='wladd')openForm('worklog',null,{staffId:a.dataset.st||ME.id});
  else if(act==='adsadd')openForm('adsrep',null,{staffId:a.dataset.st||ME.id});
  else if(act==='wlok'){const x=(D.worklog||[]).find(w=>w.id===a.dataset.id);if(x){a.disabled=true;await saveQuiet('worklog',x.id,{...x,approved:'Đã duyệt'},'Đã duyệt');}}
  else if(act==='reqst'){const x=(D.reqs||[]).find(r=>r.id===a.dataset.id);if(x){a.disabled=true;await saveQuiet('reqs',x.id,{...x,status:a.dataset.st,assignee:x.assignee||ME.id},a.dataset.st==='Hoàn thành'?'Đã hoàn thành':'Đã nhận việc');}}
  else if(act==='caladd')openForm('tasks',null,{due:a.dataset.d});
  else if(act==='tkst'){const x=D.tasks.find(t=>t.id===a.dataset.id);if(x){a.disabled=true;await saveQuiet('tasks',x.id,{...x,status:a.dataset.st,doneAt:a.dataset.st==='Xong'?todayStr():''},a.dataset.st==='Xong'?'Đã báo hoàn thành':'Đã nhận làm');}}
  else if(act==='stquit'){const s=D.staff.find(x=>x.id===a.dataset.id);if(!s)return;const on=isActive(s);if(on&&a.dataset.sure!=='1'){a.dataset.sure='1';a.textContent='Bấm lần nữa';return;}
    a.disabled=true;await saveQuiet('staff',s.id,{...s,status:on?'Đã nghỉ':'Đang làm',endDate:on?todayStr():''},on?'Đã chuyển sang Đã nghỉ':'Đã mở lại tài khoản');}
},true);
document.addEventListener('change',async e=>{const el=e.target,ds=el.dataset||{};
  if(ds.fdate){S.f[ds.fdate]=el.value||todayStr();render();return;}
  if(ds.fsel){S.f[ds.fsel]=el.value;render();return;}
  if(ds.fst){S.f.st=S.f.st||{};S.f.st[ds.fst]=el.type==='checkbox'?el.checked:el.value;render();return;}
  if(ds.kstaff){const c=chanOf(ds.kstaff);if(c){el.disabled=true;await saveQuiet('kenh',c.id,{...c,staffId:el.value},'Đã gán người phụ trách');}return;}
  if(ds.kpi){el.disabled=true;await saveQuiet('chkpi',null,{month:S.month,channelId:ds.kpi,target:+el.value||0},'Đã lưu KPI');return;}
  if(ds.clq){el.disabled=true;await saveQuiet('clog',null,{date:ds.d,itemId:ds.clq,staffId:ds.cls,qty:+el.value||0},'Đã lưu');return;}
  if(ds.dsrev){const c=chanOf(ds.dsrev),ex=(D.chrep||[]).find(x=>x.channelId===ds.dsrev&&x.date===ds.d);el.disabled=true;
    await saveQuiet('chrep',ex?ex.id:null,{...(ex||{}),date:ds.d,channelId:ds.dsrev,staffId:(ex&&ex.staffId)||(c&&c.staffId)||ME.id,revenue:+el.value||0},'Đã lưu doanh số');return;}
  if(ds.akpi){const k=adsK(ds.akpi,S.month)||{};el.disabled=true;await saveQuiet('adskpi',null,{...k,month:S.month,staffId:ds.akpi,[ds.k]:+el.value||0},'Đã lưu KPI');return;}
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.fst==='q'){S.f.st=S.f.st||{};S.f.st.q=el.value;render();}});

</script>
